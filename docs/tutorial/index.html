"Sprache","settings.animations":"Neon-Animationen","settings.reduce":"Effekte reduzieren (kein Leuchten, keine Animation)","settings.intensity":"Theme-Intensität","settings.export":"Export","settings.export_dir":"Standard-Exportordner","settings.png_size":"Standard-PNG-Größe","settings.ico_sizes":"Größen in der .ico","settings.restore":"Standard wiederherstellen","about.desc":"Schöne eigene Ordner-Icons mit Farben, Verläufen, Bild-Covern, Licht, Schatten und PNG-Bildern — als .ico oder .png exportiert, für Windows und Linux.","about.meaning":"„Dosye“ bedeutet „Ordner“ auf Haitianisch-Kreolisch. 🇭🇹","about.site":"Offizielle Website","about.project":"Projekt auf GitHub","about.donate":"Spenden","about.license":"Lizenz: GPL-3.0","help.title":"Hilfe","help.shortcuts.title":"Tastenkürzel","repair.title":"Ordnersymbole reparieren","act.export_ico":"Icon exportieren (.ico)","act.export_png":"PNG exportieren","act.open_preset":"Vorlage öffnen","act.save_preset":"Vorlage speichern","act.surprise":"Überrasch mich (Zufallsdesign)","act.search":"Formen suchen","act.settings":"Einstellungen","act.help":"Hilfe","act.quit":"Beenden","_language":"Deutsch"},"help":{"start.title":"Erste Schritte","start.body":"1. Wähle links eine <b>Form</b>. 2. Stelle rechts <b>Fill</b> <span class=\"nat\">(Füllung)</span> und Effekte ein. 3. Klicke auf <b>Export icon (.ico)</b> <span class=\"nat\">(Icon exportieren (.ico))</span> oder <b>Apply icon to a folder</b> <span class=\"nat\">(Icon auf Ordner anwenden)</span>. Keine Idee? Drücke <b>Surprise me</b> <span class=\"nat\">(Überrasch mich)</span>.","shapes.title":"Formen","shapes.body":"Es gibt 51 Formen in sechs Kategorien. Nutze die Kategorie-Schaltflächen oder das Suchfeld (Akzente optional). Die Vorschaubilder verwenden immer deine aktuellen Farben.","fill.title":"Farbe, Verlauf und Cover","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Farbe / Verlauf)</span> färbt den Ordner mit einer oder zwei Farben (Rechtsklick auf eine Palettenfarbe setzt die zweite). <b>Image (cover)</b> <span class=\"nat\">(Bild (Cover))</span> nutzt jedes Foto oder jede Textur: auf den ganzen Ordner oder nur die Vorderseite, als Füllen, Einpassen oder Kacheln — dann zoomen, verschieben (in der Vorschau ziehen), tönen und mit der Farbe mischen.","png.title":"PNG-Bild: schaut raus oder Emblem","png.body":"Lade ein PNG (oder lege es auf der Vorschau ab). <b>Coming out</b> <span class=\"nat\">(Schaut raus)</span> setzt es zwischen Rück- und Vorderseite, als würde es aus dem Ordner schauen. <b>Emblem</b> druckt es auf die Vorderseite — in Originalfarben, geprägt oder als weiße Silhouette. In der Vorschau ziehen, mit dem Mausrad skalieren; <b>Shift</b> halten, um zwischen PNG und Cover zu wechseln.","effects.title":"Licht, Schatten und Details","effects.body":"Stelle Lichtstärke und -richtung, Glanz, äußeres Leuchten, Schlagschatten, Innenschattierung, Papiere im Ordner, Milchglas-Vorderseite, Kontur und den gespiegelten Reiter (rechts) ein. Alles funktioniert mit jeder Form.","export.title":"Exportieren","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Icon exportieren (.ico))</span> schreibt eine Datei mit mehreren Größen (16 bis 256 px — wählbar in den Einstellungen). <b>Export PNG</b> <span class=\"nat\">(PNG exportieren)</span> speichert Bilder mit 256, 512 oder 1024 px und Transparenz.","folder.title":"Icon auf einen Ordner anwenden","folder.body":"Dosye schreibt das Symbol <b>in den Ordner</b>, in allen Formaten zugleich: ein verstecktes .ico mit einer desktop.ini (Windows), ein verstecktes PNG mit einer .directory-Datei (KDE Dolphin, PCManFM-Qt) und unter Linux die GIO-Einstellung, die GNOME Dateien, Nemo, Caja und Thunar verwenden. So zeigt derselbe Ordner sein Symbol unter Windows und Linux, sogar auf einem USB-Stick. Drücke F5, wenn der Explorer nicht aktualisiert. <b>Symbol von einem Ordner entfernen</b> löscht alles davon.","repair.title":"Symbol nach dem Kopieren weg? Reparieren","repair.body":"Windows zeigt ein Ordnersymbol nur, solange der Ordner ein besonderes Attribut trägt, und Kopieren mit dem Explorer, Zip-Dateien, Cloud-Synchronisation oder Kopieren von Linux aus können es verlieren. GNOME Dateien, Nemo, Caja und Thunar speichern die Symboleinstellung auf jedem Rechner, sie reist also auch nicht mit. Die Symboldateien reisen aber mit dem Ordner: Klicke auf <b>Repair folder icons</b> <span class=\"nat\">(Ordnersymbole reparieren…)</span>, wähle einen Ordner oder ein ganzes Laufwerk, und Dosye stellt alle dort und in allen Unterordnern angelegten Symbole wieder her. KDE Dolphin und PCManFM-Qt brauchen keine Reparatur. Tipp: Unter Windows behält <code>xcopy /E /H /K</code> das Attribut.","presets.title":"Vorlagen","presets.body":"<b>Save</b> <span class=\"nat\">(Speichern)</span> legt dein Design als .dosye.json mit eingebetteten Bildern ab, damit es auf jedem Rechner funktioniert. <b>Open</b> <span class=\"nat\">(Öffnen)</span> liest auch Vorlagen aus Gerador de Pastas (.pasta.json). Du kannst eine Vorlage auch auf der Vorschau ablegen."},"page":{"nav_download":"Download","nav_tutorial":"Anleitung","nav_links":"Links","lang_label":"Sprache","kicker":"Kostenlos & Open Source · Windows & Linux","cta_windows":"Für Windows herunterladen","cta_linux":"Für Linux herunterladen","cta_github":"Auf GitHub ansehen","version":"Version","dl_title":"Download","dl_sub":"Portabel — nichts zu installieren. Wähle dein System:","dl_exe":"Windows 10/11 · 64 Bit · eine portable Datei: Doppelklick zum Starten.","dl_appimage":"Linux x86_64 · ausführbar machen und starten.","dl_targz":"Linux x86_64 · entpacken und ./dosye starten — oder ./install.sh für einen Menüeintrag (ohne root).","dl_all":"Alle Versionen","smart_title":"Windows SmartScreen","smart_body":"Die Datei ist noch nicht signiert, daher zeigt Windows eventuell „Der Computer wurde durch Windows geschützt“. Klicke auf {more} und dann auf {run}.","linux_cmd":"Unter Linux:","tut_title":"Anleitung","tut_sub":"Alles, was Dosye kann, Schritt für Schritt.","where":"Wo","controls":"Bedienelemente","s_first":"Download und erster Start","first_text":"Öffne Dosye: links die Formen, in der Mitte die Live-Vorschau (darunter die echten Symbolgrößen) und rechts das Design-Panel. Jede Änderung ist sofort sichtbar.","s_colors":"Farben und Verläufe","colors_text":"Wähle unter {fill} die Option {color}. Lege die Hauptfarbe fest, aktiviere den Verlauf für eine zweite Farbe und stelle den Winkel ein. Klick auf ein Palettenfeld = Hauptfarbe, Rechtsklick = zweite Farbe.","settings_text":"Öffne {settings} über das Zahnrad oben. Deine Auswahl wird pro Benutzer gespeichert.","st_lang":"eine der 15 Sprachen — die ganze Oberfläche wechselt sofort.","st_anim":"funkelnde Sterne, atmende Leuchteffekte und weiche Übergänge; jederzeit abschaltbar.","st_reduce":"flache, statische Oberfläche für langsame PCs oder Remote-Desktop.","st_intensity":"wie kräftig das Neon-Design wirkt.","st_export":"Standard-Exportordner, Standard-PNG-Größe und die Größen in der .ico.","about_text":"{help} erklärt jede Funktion und listet die Tastenkürzel. {about} zeigt Version, Lizenz und Links zur Website, zum Projekt und zu Spenden.","tbl_title":"Was mit dem Ordner mitreist","tbl_situation":"Situation","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Dateien / Nemo / Caja / Thunar","r1":"Symbol von Dosye direkt auf dem USB-Stick angewendet (unter Windows oder Linux), an einem anderen PC geöffnet","r2":"Ordner Windows → USB-Stick → Windows mit dem Explorer kopiert","r3":"Ordner mit xcopy /E /H /K kopiert (behält Attribute)","r4":"Ordner von einer Linux-Platte (ext4/btrfs) nach Windows kopiert","r5":"Windows → Linux","r6":"Zip-Archive, OneDrive / Google Drive / Dropbox","c_auto":"automatisch","c_repair":"Reparieren","c_once":"einmal pro PC reparieren","c_maybe":"automatisch, wenn das Attribut erhalten blieb, sonst Reparieren","c_hidden":"automatisch, wenn versteckte Dateien erhalten bleiben","legend":"✅ klappt automatisch · 🔧 ein Klick auf {repair}","links_title":"Links","l_site":"Offizielle Website","l_repo":"Quellcode auf GitHub","l_releases":"Versionen & Änderungen","l_donate":"Projekt unterstützen","footer":"Dosye ist freie Software unter der GPL-3.0. Mit ♥ gemacht von cleitinhodev.","top":"Nach oben","shot_hint":"Zum Vergrößern klicken","meaning":"„Dosye“ bedeutet auf Haitianisch „Ordner“."},"win":["Weitere Informationen","Trotzdem ausführen"]},"it":{"ui":{"app.tagline":"Icone per cartelle belle e personalizzate — luce, ombra, immagini ed esportazione .ico","shapes.title":"Forme","shapes.search":"Cerca forme…","hdr.surprise":"Sorprendimi","hdr.open":"Apri","hdr.save":"Salva","hdr.reset":"Ripristina","hdr.settings":"Impostazioni","hdr.help":"Aiuto","hdr.about":"Informazioni su Dosye","hdr.donate":"Dona","cat.all":"Tutte","cat.classic":"Classiche","cat.modern":"Moderne","cat.retro":"Retrò","cat.office":"Ufficio","cat.fun":"Divertenti","cat.special":"Speciali","preview.title":"Anteprima","fill.title":"Riempimento","fill.color":"Colore / sfumatura","fill.image":"Immagine (copertina)","cover.choose":"Scegli immagine…","cover.examples":"Copertine di esempio:","cover.apply_to":"Applica a","cover.area_all":"Tutta la cartella","cover.area_front":"Solo il fronte","fit.cobrir":"Riempi","fit.ajustar":"Adatta","fit.lado":"Affianca","cover.zoom":"Zoom","cover.tint":"Tingi con il colore","cover.blend":"Fusione colore","cover.back_dark":"Scurisci il retro","color.main":"Colore principale","color.gradient":"Usa sfumatura","color.second":"Secondo colore","color.angle":"Angolo sfumatura","color.palette":"Tavolozza rapida (clic destro = 2º colore)","light.title":"Luce e lucentezza","light.intensity":"Intensità della luce","light.dir":"Direzione della luce","light.gloss":"Finitura lucida","light.glow":"Bagliore esterno","shadow.title":"Ombra","shadow.drop":"Ombra proiettata","shadow.inner":"Ombreggiatura interna","details.title":"Dettagli","details.papers":"Fogli dentro la cartella","details.mirror":"Linguetta a destra (specchio)","details.glass":"Fronte in vetro satinato","details.border":"Contorno","png.title":"Immagine PNG","png.none":"Nessuna","png.inside":"In uscita","png.front":"Emblema","png.load":"Carica PNG…","png.scale":"Dimensione","png.rot":"Rotazione","png.shadow":"Ombra dell'immagine","png.emblem_style":"Stile emblema","emblem.original":"Colori originali","emblem.gravado":"In rilievo","emblem.branco":"Silhouette bianca","export.ico":"Esporta icona (.ico)","export.png":"Esporta PNG","export.apply":"Applica icona a una cartella…","export.remove":"Rimuovi icona da una cartella…","export.repair":"Ripara icone delle cartelle…","settings.title":"Impostazioni","settings.language":"Lingua","settings.animations":"Animazioni neon","settings.reduce":"Riduci effetti (niente bagliori né animazioni)","settings.intensity":"Intensità del tema","settings.export":"Esportazione","settings.export_dir":"Cartella di esportazione predefinita","settings.png_size":"Dimensione PNG predefinita","settings.ico_sizes":"Dimensioni nel file .ico","settings.restore":"Ripristina predefiniti","about.desc":"Icone per cartelle personalizzate con colori, sfumature, copertine, luce, ombra e immagini PNG — esportate in .ico o .png, per Windows e Linux.","about.meaning":"“Dosye” significa “cartella” in creolo haitiano. 🇭🇹","about.site":"Sito ufficiale","about.project":"Progetto su GitHub","about.donate":"Dona","about.license":"Licenza: GPL-3.0","help.title":"Aiuto","help.shortcuts.title":"Scorciatoie da tastiera","repair.title":"Ripara icone delle cartelle","act.export_ico":"Esporta icona (.ico)","act.export_png":"Esporta PNG","act.open_preset":"Apri preset","act.save_preset":"Salva preset","act.surprise":"Sorprendimi (design casuale)","act.search":"Cerca forme","act.settings":"Impostazioni","act.help":"Aiuto","act.quit":"Esci","_language":"Italiano"},"help":{"start.title":"Per iniziare","start.body":"1. Scegli una <b>forma</b> a sinistra. 2. Regola il <b>Fill</b> <span class=\"nat\">(riempimento)</span> e gli effetti a destra. 3. Fai clic su <b>Export icon (.ico)</b> <span class=\"nat\">(Esporta icona (.ico))</span> o <b>Apply icon to a folder</b> <span class=\"nat\">(Applica icona a una cartella)</span>. Senza idee? Premi <b>Surprise me</b> <span class=\"nat\">(Sorprendimi)</span>.","shapes.title":"Forme","shapes.body":"Ci sono 51 forme in sei categorie. Usa i pulsanti delle categorie o scrivi nella casella di ricerca (accenti facoltativi). Le miniature usano sempre i tuoi colori attuali.","fill.title":"Colore, sfumatura e copertina","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Colore / sfumatura)</span> dipinge la cartella con uno o due colori (clic destro su un colore della tavolozza per il secondo). <b>Image (cover)</b> <span class=\"nat\">(Immagine (copertina))</span> usa qualsiasi foto o texture: applicala a tutta la cartella o solo al fronte, scegli Riempi, Adatta o Affianca, poi zooma, sposta (trascinando nell'anteprima), tingi e fondi con il colore.","png.title":"Immagine PNG: in uscita o emblema","png.body":"Carica un PNG (o rilascialo sull'anteprima). <b>Coming out</b> <span class=\"nat\">(In uscita)</span> lo mette tra retro e fronte, come se spuntasse dalla cartella. <b>Emblem</b> <span class=\"nat\">(Emblema)</span> lo stampa sul fronte con i colori originali, in rilievo o come silhouette bianca. Trascinalo nell'anteprima e usa la rotellina per ridimensionarlo; tieni <b>Shift</b> per alternare tra PNG e copertina.","effects.title":"Luce, ombra e dettagli","effects.body":"Regola intensità e direzione della luce, lucentezza, bagliore esterno, ombra proiettata, ombreggiatura interna, fogli interni, fronte in vetro satinato, contorno e linguetta speculare (a destra). Tutto funziona con ogni forma.","export.title":"Esportare","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Esporta icona (.ico))</span> scrive un unico file con più dimensioni (da 16 a 256 px — sceglile nelle Impostazioni). <b>Export PNG</b> <span class=\"nat\">(Esporta PNG)</span> salva immagini da 256, 512 o 1024 px con trasparenza.","folder.title":"Applicare l'icona a una cartella","folder.body":"Dosye scrive l'icona <b>dentro la cartella</b> in tutti i formati insieme: un .ico nascosto con un desktop.ini (Windows), un PNG nascosto con un file .directory (KDE Dolphin, PCManFM-Qt) e, su Linux, l'impostazione GIO usata da GNOME File, Nemo, Caja e Thunar. Così la stessa cartella mostra la sua icona su Windows e su Linux, anche su una chiavetta. Premi F5 se Esplora file non si aggiorna. <b>Remove icon from a folder</b> <span class=\"nat\">(Rimuovi icona da una cartella)</span> cancella tutto.","repair.title":"Icona sparita dopo una copia? Riparala","repair.body":"Windows mostra l'icona di una cartella solo finché la cartella ha un attributo speciale, e copiare con Esplora file, comprimere in zip, sincronizzare col cloud o copiare da Linux può perderlo. GNOME File, Nemo, Caja e Thunar salvano l'impostazione dell'icona su ogni computer, quindi neanche quella viaggia. I file dell'icona invece viaggiano con la cartella: fai clic su <b>Repair folder icons</b> <span class=\"nat\">(Ripara icone delle cartelle…)</span>, scegli una cartella o un'intera unità e Dosye ripristina tutte le icone che vi ha creato, in tutte le sottocartelle. KDE Dolphin e PCManFM-Qt non hanno bisogno di riparazioni. Suggerimento: su Windows, <code>xcopy /E /H /K</code> mantiene l'attributo.","presets.title":"Preset","presets.body":"<b>Save</b> <span class=\"nat\">(Salva)</span> memorizza il tuo design in un file .dosye.json con le immagini incorporate, così funziona su qualsiasi computer. <b>Open</b> <span class=\"nat\">(Apri)</span> legge anche i preset di Gerador de Pastas (.pasta.json). Puoi anche rilasciare un preset sull'anteprima."},"page":{"nav_download":"Download","nav_tutorial":"Tutorial","nav_links":"Link","lang_label":"Lingua","kicker":"Gratis e open source · Windows e Linux","cta_windows":"Scarica per Windows","cta_linux":"Scarica per Linux","cta_github":"Vedi su GitHub","version":"Versione","dl_title":"Download","dl_sub":"Portatile — niente da installare. Scegli il tuo sistema:","dl_exe":"Windows 10/11 · 64 bit · un unico file portatile: doppio clic per avviarlo.","dl_appimage":"Linux x86_64 · rendilo eseguibile e avvialo.","dl_targz":"Linux x86_64 · estrai ed esegui ./dosye — oppure ./install.sh per aggiungerlo al menu (senza root).","dl_all":"Tutte le versioni","smart_title":"SmartScreen di Windows","smart_body":"L'eseguibile non è ancora firmato, quindi Windows potrebbe mostrare «PC protetto da Windows». Fai clic su {more} e poi su {run}.","linux_cmd":"Su Linux:","tut_title":"Tutorial","tut_sub":"Tutto quello che fa Dosye, passo dopo passo.","where":"Dove","controls":"Comandi","s_first":"Download e primo avvio","first_text":"Apri Dosye: a sinistra le forme, al centro l'anteprima dal vivo (con le vere dimensioni dell'icona sotto) e a destra il pannello di design. Ogni modifica si vede subito.","s_colors":"Colori e sfumature","colors_text":"In {fill}, scegli {color}. Imposta il colore principale, attiva la sfumatura per aggiungere un secondo colore e regola l'angolo. Clic su un colore della tavolozza = principale, clic destro = secondo.","settings_text":"Apri {settings} dal pulsante a ingranaggio in alto. Le scelte vengono salvate per utente.","st_lang":"scegli una delle 15 lingue — tutta l'interfaccia cambia subito.","st_anim":"stelle scintillanti, bagliori che respirano e transizioni morbide; disattivabili quando vuoi.","st_reduce":"interfaccia piatta e statica per PC lenti o desktop remoto.","st_intensity":"quanto è intenso il tema neon.","st_export":"cartella di esportazione predefinita, dimensione PNG predefinita e dimensioni incluse nel .ico.","about_text":"{help} spiega ogni funzione ed elenca le scorciatoie da tastiera. {about} mostra la versione, la licenza e i link al sito, al progetto e alle donazioni.","tbl_title":"Cosa viaggia con la cartella","tbl_situation":"Situazione","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME File / Nemo / Caja / Thunar","r1":"Icona applicata da Dosye direttamente sulla chiavetta (da Windows o Linux), aperta su un altro PC","r2":"Cartella copiata Windows → chiavetta → Windows con Esplora file","r3":"Cartella copiata con xcopy /E /H /K (mantiene gli attributi)","r4":"Cartella copiata da un disco Linux (ext4/btrfs) a Windows","r5":"Windows → Linux","r6":"zip, OneDrive / Google Drive / Dropbox","c_auto":"automatico","c_repair":"Ripara","c_once":"Ripara una volta per PC","c_maybe":"automatico se l'attributo è rimasto, altrimenti Ripara","c_hidden":"automatico se i file nascosti restano","legend":"✅ funziona da solo · 🔧 un clic su {repair}","links_title":"Link","l_site":"Sito ufficiale","l_repo":"Codice sorgente su GitHub","l_releases":"Versioni e novità","l_donate":"Sostieni il progetto","footer":"Dosye è software libero con licenza GPL-3.0. Fatto con ♥ da cleitinhodev.","top":"Torna su","shot_hint":"Clic per ingrandire","meaning":"«Dosye» significa «cartella» in creolo haitiano."},"win":["Ulteriori informazioni","Esegui comunque"]},"pl":{"ui":{"app.tagline":"Piękne własne ikony folderów — światło, cień, obrazy i eksport .ico","shapes.title":"Kształty","shapes.search":"Szukaj kształtów…","hdr.surprise":"Zaskocz mnie","hdr.open":"Otwórz","hdr.save":"Zapisz","hdr.reset":"Resetuj","hdr.settings":"Ustawienia","hdr.help":"Pomoc","hdr.about":"O programie Dosye","hdr.donate":"Wesprzyj","cat.all":"Wszystkie","cat.classic":"Klasyczne","cat.modern":"Nowe","cat.retro":"Retro","cat.office":"Biurowe","cat.fun":"Zabawne","cat.special":"Specjalne","preview.title":"Podgląd","fill.title":"Wypełnienie","fill.color":"Kolor / gradient","fill.image":"Obraz (okładka)","cover.choose":"Wybierz obraz…","cover.examples":"Przykładowe okładki:","cover.apply_to":"Zastosuj do","cover.area_all":"Cały folder","cover.area_front":"Tylko przód","fit.cobrir":"Wypełnij","fit.ajustar":"Dopasuj","fit.lado":"Kafelki","cover.zoom":"Powiększenie","cover.tint":"Zabarw kolorem","cover.blend":"Mieszanie kolorów","cover.back_dark":"Przyciemnij tył","color.main":"Kolor główny","color.gradient":"Użyj gradientu","color.second":"Drugi kolor","color.angle":"Kąt gradientu","color.palette":"Szybka paleta (prawy klik = 2. kolor)","light.title":"Światło i połysk","light.intensity":"Natężenie światła","light.dir":"Kierunek światła","light.gloss":"Połysk","light.glow":"Poświata zewnętrzna","shadow.title":"Cień","shadow.drop":"Cień rzucany","shadow.inner":"Cieniowanie wewnętrzne","details.title":"Szczegóły","details.papers":"Kartki w folderze","details.mirror":"Zakładka po prawej (lustro)","details.glass":"Przód z matowego szkła","details.border":"Obrys","png.title":"Obraz PNG","png.none":"Brak","png.inside":"Wychodzi","png.front":"Emblemat","png.load":"Wczytaj PNG…","png.scale":"Rozmiar","png.rot":"Obrót","png.shadow":"Cień obrazu","png.emblem_style":"Styl emblematu","emblem.original":"Oryginalne kolory","emblem.gravado":"Wytłoczony","emblem.branco":"Biała sylwetka","export.ico":"Eksportuj ikonę (.ico)","export.png":"Eksportuj PNG","export.apply":"Ustaw ikonę folderu…","export.remove":"Usuń ikonę z folderu…","export.repair":"Napraw ikony folderów…","settings.title":"Ustawienia","settings.language":"Język","settings.animations":"Animacje neonowe","settings.reduce":"Ogranicz efekty (bez poświaty i animacji)","settings.intensity":"Intensywność motywu","settings.export":"Eksport","settings.export_dir":"Domyślny folder eksportu","settings.png_size":"Domyślny rozmiar PNG","settings.ico_sizes":"Rozmiary w pliku .ico","settings.restore":"Przywróć domyślne","about.desc":"Piękne własne ikony folderów z kolorami, gradientami, okładkami, światłem, cieniem i obrazami PNG — eksport do .ico lub .png, dla Windows i Linuksa.","about.meaning":"„Dosye” znaczy „folder” w języku haitańskim kreolskim. 🇭🇹","about.site":"Oficjalna strona","about.project":"Projekt na GitHubie","about.donate":"Wesprzyj","about.license":"Licencja: GPL-3.0","help.title":"Pomoc","help.shortcuts.title":"Skróty klawiszowe","repair.title":"Napraw ikony folderów","act.export_ico":"Eksportuj ikonę (.ico)","act.export_png":"Eksportuj PNG","act.open_preset":"Otwórz szablon","act.save_preset":"Zapisz szablon","act.surprise":"Zaskocz mnie (losowy projekt)","act.search":"Szukaj kształtów","act.settings":"Ustawienia","act.help":"Pomoc","act.quit":"Zakończ","_language":"Polski"},"help":{"start.title":"Pierwsze kroki","start.body":"1. Wybierz <b>kształt</b> po lewej. 2. Ustaw <b>Fill</b> <span class=\"nat\">(wypełnienie)</span> i efekty po prawej. 3. Kliknij <b>Export icon (.ico)</b> <span class=\"nat\">(Eksportuj ikonę (.ico))</span> lub <b>Apply icon to a folder</b> <span class=\"nat\">(Ustaw ikonę folderu)</span>. Brak pomysłu? Naciśnij <b>Surprise me</b> <span class=\"nat\">(Zaskocz mnie)</span>.","shapes.title":"Kształty","shapes.body":"Jest 51 kształtów w sześciu kategoriach. Użyj przycisków kategorii lub pola wyszukiwania (znaki diakrytyczne opcjonalne). Miniatury zawsze używają bieżących kolorów.","fill.title":"Kolor, gradient i okładka","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Kolor / gradient)</span> maluje folder jednym lub dwoma kolorami (prawy klik na kolorze palety ustawia drugi). <b>Image (cover)</b> <span class=\"nat\">(Obraz (okładka))</span> używa dowolnego zdjęcia lub tekstury: na cały folder lub tylko przód, w trybie Wypełnij, Dopasuj lub Kafelki — potem powiększ, przesuń (przeciągając w podglądzie), zabarw i zmieszaj z kolorem.","png.title":"Obraz PNG: wychodzący lub emblemat","png.body":"Wczytaj PNG (lub upuść go na podgląd). <b>Coming out</b> <span class=\"nat\">(Wychodzi)</span> umieszcza go między tyłem a przodem, jakby wyglądał z folderu. <b>Emblem</b> <span class=\"nat\">(Emblemat)</span> drukuje go na przodzie w oryginalnych kolorach, wytłoczony lub jako białą sylwetkę. Przeciągnij go w podglądzie i zmieniaj rozmiar kółkiem; przytrzymaj <b>Shift</b>, by przełączać między PNG a okładką.","effects.title":"Światło, cień i szczegóły","effects.body":"Dostosuj natężenie i kierunek światła, połysk, poświatę, cień rzucany, cieniowanie wewnętrzne, kartki w środku, przód z matowego szkła, obrys i lustrzaną zakładkę (po prawej). Wszystko działa z każdym kształtem.","export.title":"Eksport","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Eksportuj ikonę (.ico))</span> zapisuje jeden plik z wieloma rozmiarami (od 16 do 256 px — wybierz je w Ustawieniach). <b>Export PNG</b> <span class=\"nat\">(Eksportuj PNG)</span> zapisuje obrazy 256, 512 lub 1024 px z przezroczystością.","folder.title":"Ustawianie ikony folderu","folder.body":"Dosye zapisuje ikonę <b>w folderze</b> we wszystkich formatach naraz: ukryty plik .ico z desktop.ini (Windows), ukryty PNG z plikiem .directory (KDE Dolphin, PCManFM-Qt) oraz w Linuksie ustawienie GIO używane przez Pliki GNOME, Nemo, Caja i Thunar. Dzięki temu ten sam folder pokazuje ikonę w Windows i w Linuksie, nawet na pendrivie. Naciśnij F5, jeśli Eksplorator się nie odświeży. <b>Remove icon from a folder</b> <span class=\"nat\">(Usuń ikonę z folderu)</span> kasuje to wszystko.","repair.title":"Ikona zniknęła po kopiowaniu? Napraw ją","repair.body":"Windows pokazuje ikonę folderu tylko wtedy, gdy folder ma specjalny atrybut, a kopiowanie Eksploratorem, pliki zip, synchronizacja z chmurą lub kopiowanie z Linuksa mogą go usunąć. Pliki GNOME, Nemo, Caja i Thunar zapisują ustawienie ikony na każdym komputerze osobno, więc ono też nie podróżuje. Pliki ikony podróżują jednak razem z folderem: kliknij <b>Repair folder icons</b> <span class=\"nat\">(Napraw ikony folderów…)</span>, wybierz folder lub cały dysk, a Dosye przywróci wszystkie utworzone tam ikony, we wszystkich podfolderach. KDE Dolphin i PCManFM-Qt nie wymagają naprawy. Wskazówka: w Windows <code>xcopy /E /H /K</code> zachowuje atrybut.","presets.title":"Szablony","presets.body":"<b>Save</b> <span class=\"nat\">(Zapisz)</span> przechowuje projekt w pliku .dosye.json z osadzonymi obrazami, więc działa na każdym komputerze. <b>Open</b> <span class=\"nat\">(Otwórz)</span> czyta też szablony z Gerador de Pastas (.pasta.json). Szablon możesz też upuścić na podgląd."},"page":{"nav_download":"Pobierz","nav_tutorial":"Poradnik","nav_links":"Linki","lang_label":"Język","kicker":"Darmowy i otwartoźródłowy · Windows i Linux","cta_windows":"Pobierz dla Windows","cta_linux":"Pobierz dla Linuksa","cta_github":"Zobacz na GitHubie","version":"Wersja","dl_title":"Pobierz","dl_sub":"Przenośny — nic do instalowania. Wybierz system:","dl_exe":"Windows 10/11 · 64 bity · jeden przenośny plik: kliknij dwukrotnie, aby uruchomić.","dl_appimage":"Linux x86_64 · nadaj prawo wykonywania i uruchom.","dl_targz":"Linux x86_64 · rozpakuj i uruchom ./dosye — albo ./install.sh, aby dodać skrót do menu (bez roota).","dl_all":"Wszystkie wydania","smart_title":"Windows SmartScreen","smart_body":"Plik nie jest jeszcze podpisany cyfrowo, więc Windows może pokazać „System Windows ochronił ten komputer”. Kliknij {more}, a potem {run}.","linux_cmd":"W Linuksie:","tut_title":"Poradnik","tut_sub":"Wszystko, co potrafi Dosye, krok po kroku.","where":"Gdzie","controls":"Elementy","s_first":"Pobieranie i pierwsze uruchomienie","first_text":"Otwórz Dosye: po lewej kształty, pośrodku podgląd na żywo (pod nim prawdziwe rozmiary ikony), po prawej panel projektu. Każda zmiana jest widoczna od razu.","s_colors":"Kolory i gradienty","colors_text":"W sekcji {fill} wybierz {color}. Ustaw kolor główny, włącz gradient, aby dodać drugi kolor, i ustaw jego kąt. Kliknięcie koloru z palety = kolor główny, prawy przycisk = drugi.","settings_text":"Otwórz {settings} przyciskiem z kołem zębatym w nagłówku. Wybory są zapisywane dla użytkownika.","st_lang":"wybierz jeden z 15 języków — cały interfejs zmienia się od razu.","st_anim":"migoczące gwiazdy, pulsujące poświaty i płynne przejścia; można je wyłączyć.","st_reduce":"płaski, statyczny interfejs dla wolnych komputerów lub pulpitu zdalnego.","st_intensity":"jak mocny jest motyw neonowy.","st_export":"domyślny folder eksportu, domyślny rozmiar PNG i rozmiary w pliku .ico.","about_text":"{help} wyjaśnia każdą funkcję i pokazuje skróty klawiszowe. {about} pokazuje wersję, licencję i linki do strony, projektu i darowizn.","tbl_title":"Co podróżuje razem z folderem","tbl_situation":"Sytuacja","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"Pliki GNOME / Nemo / Caja / Thunar","r1":"Ikona ustawiona przez Dosye bezpośrednio na pendrivie (z Windows lub Linuksa), otwarta na innym komputerze","r2":"Folder skopiowany Windows → pendrive → Windows Eksploratorem","r3":"Folder skopiowany przez xcopy /E /H /K (zachowuje atrybuty)","r4":"Folder skopiowany z dysku linuksowego (ext4/btrfs) do Windows","r5":"Windows → Linux","r6":"archiwa zip, OneDrive / Google Drive / Dropbox","c_auto":"automatycznie","c_repair":"Napraw","c_once":"Napraw raz na komputer","c_maybe":"automatycznie, jeśli atrybut przetrwał, inaczej Napraw","c_hidden":"automatycznie, jeśli ukryte pliki zostaną","legend":"✅ działa samo · 🔧 jedno kliknięcie w {repair}","links_title":"Linki","l_site":"Oficjalna strona","l_repo":"Kod źródłowy na GitHubie","l_releases":"Wydania i zmiany","l_donate":"Wesprzyj projekt","footer":"Dosye to wolne oprogramowanie na licencji GPL-3.0. Zrobione z ♥ przez cleitinhodev.","top":"Do góry","shot_hint":"Kliknij, aby powiększyć","meaning":"„Dosye” po haitańsku znaczy „folder”."},"win":["Więcej informacji","Uruchom mimo to"]},"tr":{"ui":{"app.tagline":"Güzel, özel klasör simgeleri — ışık, gölge, görseller ve .ico dışa aktarma","shapes.title":"Şekiller","shapes.search":"Şekil ara…","hdr.surprise":"Şaşırt beni","hdr.open":"Aç","hdr.save":"Kaydet","hdr.reset":"Sıfırla","hdr.settings":"Ayarlar","hdr.help":"Yardım","hdr.about":"Dosye hakkında","hdr.donate":"Bağış yap","cat.all":"Tümü","cat.classic":"Klasik","cat.modern":"Modern","cat.retro":"Retro","cat.office":"Ofis","cat.fun":"Eğlenceli","cat.special":"Özel","preview.title":"Önizleme","fill.title":"Dolgu","fill.color":"Renk / geçiş","fill.image":"Görsel (kapak)","cover.choose":"Görsel seç…","cover.examples":"Örnek kapaklar:","cover.apply_to":"Uygula","cover.area_all":"Tüm klasör","cover.area_front":"Yalnızca ön","fit.cobrir":"Doldur","fit.ajustar":"Sığdır","fit.lado":"Döşe","cover.zoom":"Yakınlaştır","cover.tint":"Renkle tonla","cover.blend":"Renk karışımı","cover.back_dark":"Arkayı koyulaştır","color.main":"Ana renk","color.gradient":"Geçiş kullan","color.second":"İkinci renk","color.angle":"Geçiş açısı","color.palette":"Hızlı palet (sağ tık = 2. renk)","light.title":"Işık ve parlaklık","light.intensity":"Işık yoğunluğu","light.dir":"Işık yönü","light.gloss":"Parlak yüzey","light.glow":"Dış parıltı","shadow.title":"Gölge","shadow.drop":"Düşen gölge","shadow.inner":"İç gölgelendirme","details.title":"Ayrıntılar","details.papers":"Klasör içinde kâğıtlar","details.mirror":"Sekme sağda (ayna)","details.glass":"Buzlu cam ön yüz","details.border":"Kontur","png.title":"PNG görseli","png.none":"Yok","png.inside":"Çıkıyor","png.front":"Amblem","png.load":"PNG yükle…","png.scale":"Boyut","png.rot":"Döndürme","png.shadow":"Görsel gölgesi","png.emblem_style":"Amblem stili","emblem.original":"Orijinal renkler","emblem.gravado":"Kabartma","emblem.branco":"Beyaz siluet","export.ico":"Simgeyi dışa aktar (.ico)","export.png":"PNG dışa aktar","export.apply":"Simgeyi klasöre uygula…","export.remove":"Klasörden simgeyi kaldır…","export.repair":"Klasör simgelerini onar…","settings.title":"Ayarlar","settings.language":"Dil","settings.animations":"Neon animasyonları","settings.reduce":"Efektleri azalt (parıltı ve animasyon yok)","settings.intensity":"Tema yoğunluğu","settings.export":"Dışa aktarma","settings.export_dir":"Varsayılan dışa aktarma klasörü","settings.png_size":"Varsayılan PNG boyutu","settings.ico_sizes":".ico içindeki boyutlar","settings.restore":"Varsayılanlara dön","about.desc":"Renkler, geçişler, görsel kapaklar, ışık, gölge ve PNG görsellerle güzel özel klasör simgeleri — Windows ve Linux için .ico veya .png olarak.","about.meaning":"“Dosye”, Haiti Kreolcesinde “klasör” demektir. 🇭🇹","about.site":"Resmî site","about.project":"GitHub'daki proje","about.donate":"Bağış yap","about.license":"Lisans: GPL-3.0","help.title":"Yardım","help.shortcuts.title":"Klavye kısayolları","repair.title":"Klasör simgelerini onar","act.export_ico":"Simgeyi dışa aktar (.ico)","act.export_png":"PNG dışa aktar","act.open_preset":"Şablon aç","act.save_preset":"Şablonu kaydet","act.surprise":"Şaşırt beni (rastgele tasarım)","act.search":"Şekil ara","act.settings":"Ayarlar","act.help":"Yardım","act.quit":"Çık","_language":"Türkçe"},"help":{"start.title":"Başlarken","start.body":"1. Soldan bir <b>şekil</b> seç. 2. Sağda <b>Fill</b> <span class=\"nat\">(dolgu)</span> ve efektleri ayarla. 3. <b>Export icon (.ico)</b> <span class=\"nat\">(Simgeyi dışa aktar (.ico))</span> veya <b>Apply icon to a folder</b> <span class=\"nat\">(Simgeyi klasöre uygula)</span>'ya tıkla. Fikrin yok mu? <b>Surprise me</b> <span class=\"nat\">(Şaşırt beni)</span>'ye bas.","shapes.title":"Şekiller","shapes.body":"Altı kategoride 51 şekil var. Kategori düğmelerini kullan veya arama kutusuna yaz (aksanlar isteğe bağlı). Küçük resimler her zaman mevcut renklerini kullanır.","fill.title":"Renk, geçiş ve kapak","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Renk / geçiş)</span> klasörü bir veya iki renkle boyar (ikinci renk için paletteki bir renge sağ tıkla). <b>Image (cover)</b> <span class=\"nat\">(Görsel (kapak))</span> herhangi bir fotoğraf veya dokuyu kullanır: tüm klasöre veya yalnızca öne uygula, Doldur, Sığdır veya Döşe seç; ardından yakınlaştır, taşı (önizlemede sürükle), tonla ve renkle karıştır.","png.title":"PNG görseli: çıkıyor veya amblem","png.body":"Bir PNG yükle (veya önizlemeye bırak). <b>Coming out</b> <span class=\"nat\">(Çıkıyor)</span> onu arka ile ön arasına yerleştirir, klasörden bakıyormuş gibi. <b>Emblem</b> <span class=\"nat\">(Amblem)</span> onu öne orijinal renklerle, kabartma olarak veya beyaz siluet halinde basar. Önizlemede sürükle, boyut için tekerleği kullan; PNG ile kapak arasında geçmek için <b>Shift</b>'e bas.","effects.title":"Işık, gölge ve ayrıntılar","effects.body":"Işık yoğunluğu ve yönünü, parlaklığı, dış parıltıyı, düşen gölgeyi, iç gölgelendirmeyi, içteki kâğıtları, buzlu cam ön yüzü, konturu ve aynalı (sağdaki) sekmeyi ayarla. Her şey tüm şekillerle çalışır.","export.title":"Dışa aktarma","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Simgeyi dışa aktar (.ico))</span> birden çok boyutlu tek bir dosya yazar (16–256 px — Ayarlar'dan seç). <b>Export PNG</b> <span class=\"nat\">(PNG dışa aktar)</span> 256, 512 veya 1024 px saydam görseller kaydeder.","folder.title":"Simgeyi klasöre uygulama","folder.body":"Dosye simgeyi tüm biçimlerde birden <b>klasörün içine</b> yazar: desktop.ini ile gizli bir .ico (Windows), .directory dosyasıyla gizli bir PNG (KDE Dolphin, PCManFM-Qt) ve Linux'ta GNOME Dosyalar, Nemo, Caja ve Thunar'ın kullandığı GIO ayarı. Böylece aynı klasör simgesini Windows'ta ve Linux'ta, flash bellekte bile gösterir. Dosya Gezgini yenilenmezse F5'e basın. <b>Remove icon from a folder</b> <span class=\"nat\">(Klasörden simgeyi kaldır)</span> bunların hepsini siler.","repair.title":"Kopyaladıktan sonra simge mi kayboldu? Onarın","repair.body":"Windows bir klasörün simgesini yalnızca klasörde özel bir öznitelik varken gösterir; Dosya Gezgini ile kopyalama, zip dosyaları, bulut eşitleme veya Linux'tan kopyalama bu özniteliği kaybettirebilir. GNOME Dosyalar, Nemo, Caja ve Thunar simge ayarını her bilgisayarda ayrı tutar, yani o da taşınmaz. Simge dosyaları ise klasörle birlikte taşınır: <b>Repair folder icons</b> <span class=\"nat\">(Klasör simgelerini onar…)</span> düğmesine tıklayın, bir klasör veya bütün bir sürücü seçin; Dosye orada ve tüm alt klasörlerde oluşturduğu her simgeyi geri yükler. KDE Dolphin ve PCManFM-Qt onarım gerektirmez. İpucu: Windows'ta <code>xcopy /E /H /K</code> özniteliği korur.","presets.title":"Şablonlar","presets.body":"<b>Save</b> <span class=\"nat\">(Kaydet)</span> tasarımını görseller gömülü bir .dosye.json dosyasına yazar; böylece her bilgisayarda çalışır. <b>Open</b> <span class=\"nat\">(Aç)</span> Gerador de Pastas şablonlarını da (.pasta.json) okur. Bir şablonu önizlemeye de bırakabilirsin."},"page":{"nav_download":"İndir","nav_tutorial":"Rehber","nav_links":"Bağlantılar","lang_label":"Dil","kicker":"Ücretsiz ve açık kaynak · Windows ve Linux","cta_windows":"Windows için indir","cta_linux":"Linux için indir","cta_github":"GitHub'da gör","version":"Sürüm","dl_title":"İndir","dl_sub":"Taşınabilir — kurulum yok. Sisteminizi seçin:","dl_exe":"Windows 10/11 · 64 bit · tek taşınabilir dosya: çalıştırmak için çift tıklayın.","dl_appimage":"Linux x86_64 · çalıştırılabilir yapın ve açın.","dl_targz":"Linux x86_64 · arşivi açıp ./dosye çalıştırın — ya da menüye eklemek için ./install.sh (root gerekmez).","dl_all":"Tüm sürümler","smart_title":"Windows SmartScreen","smart_body":"Dosya henüz dijital olarak imzalı değil, bu yüzden Windows “Windows bilgisayarınızı korudu” gösterebilir. {more} ve ardından {run} öğesine tıklayın.","linux_cmd":"Linux'ta:","tut_title":"Rehber","tut_sub":"Dosye'nin yapabildiği her şey, adım adım.","where":"Nerede","controls":"Denetimler","s_first":"İndirme ve ilk çalıştırma","first_text":"Dosye'yi açın: solda şekiller, ortada canlı önizleme (altında simgenin gerçek boyutları), sağda tasarım paneli. Her değişiklik anında görünür.","s_colors":"Renkler ve geçişler","colors_text":"{fill} bölümünde {color} seçin. Ana rengi belirleyin, ikinci renk için geçişi açın ve açısını ayarlayın. Paletteki renge tıklamak ana rengi, sağ tıklamak ikinci rengi seçer.","settings_text":"Üstteki dişli düğmesiyle {settings} açın. Seçimleriniz kullanıcı başına kaydedilir.","st_lang":"15 dilden birini seçin — tüm arayüz anında değişir.","st_anim":"parıldayan yıldızlar, nefes alan ışıltılar ve yumuşak geçişler; istediğiniz zaman kapatın.","st_reduce":"yavaş bilgisayarlar veya uzak masaüstü için düz, durağan arayüz.","st_intensity":"neon temanın ne kadar güçlü görüneceği.","st_export":"varsayılan dışa aktarma klasörü, varsayılan PNG boyutu ve .ico içindeki boyutlar.","about_text":"{help} her özelliği açıklar ve klavye kısayollarını listeler. {about} sürümü, lisansı ve web sitesi, proje ve bağış bağlantılarını gösterir.","tbl_title":"Klasörle birlikte ne taşınır","tbl_situation":"Durum","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Dosyalar / Nemo / Caja / Thunar","r1":"Simge Dosye ile doğrudan flash bellekte uygulandı (Windows veya Linux'tan), başka bir bilgisayarda açıldı","r2":"Klasör Dosya Gezgini ile Windows → flash bellek → Windows kopyalandı","r3":"Klasör xcopy /E /H /K ile kopyalandı (öznitelikleri korur)","r4":"Klasör bir Linux diskinden (ext4/btrfs) Windows'a kopyalandı","r5":"Windows → Linux","r6":"zip arşivleri, OneDrive / Google Drive / Dropbox","c_auto":"otomatik","c_repair":"Onar","c_once":"Bilgisayar başına bir kez Onar","c_maybe":"öznitelik korunduysa otomatik, yoksa Onar","c_hidden":"gizli dosyalar korunursa otomatik","legend":"✅ kendiliğinden çalışır · 🔧 {repair} için bir tık","links_title":"Bağlantılar","l_site":"Resmî web sitesi","l_repo":"GitHub'da kaynak kodu","l_releases":"Sürümler ve değişiklikler","l_donate":"Projeyi destekleyin","footer":"Dosye, GPL-3.0 lisanslı özgür bir yazılımdır. cleitinhodev tarafından ♥ ile yapıldı.","top":"Başa dön","shot_hint":"Büyütmek için tıklayın","meaning":"“Dosye”, Haiti Kreolcesinde “klasör” demektir."},"win":["Ek bilgi","Yine de çalıştır"]},"ru":{"ui":{"app.tagline":"Красивые значки папок — свет, тени, изображения и экспорт в .ico","shapes.title":"Формы","shapes.search":"Поиск форм…","hdr.surprise":"Удиви меня","hdr.open":"Открыть","hdr.save":"Сохранить","hdr.reset":"Сброс","hdr.settings":"Настройки","hdr.help":"Справка","hdr.about":"О программе Dosye","hdr.donate":"Поддержать","cat.all":"Все","cat.classic":"Классика","cat.modern":"Модерн","cat.retro":"Ретро","cat.office":"Офис","cat.fun":"Весёлые","cat.special":"Особые","preview.title":"Предпросмотр","fill.title":"Заливка","fill.color":"Цвет / градиент","fill.image":"Изображение","cover.choose":"Выбрать изображение…","cover.examples":"Примеры обложек:","cover.apply_to":"Применить к","cover.area_all":"Вся папка","cover.area_front":"Только перед","fit.cobrir":"Заполнить","fit.ajustar":"Вписать","fit.lado":"Плитка","cover.zoom":"Масштаб","cover.tint":"Тонировать цветом","cover.blend":"Смешивание цвета","cover.back_dark":"Затемнить заднюю часть","color.main":"Основной цвет","color.gradient":"Градиент","color.second":"Второй цвет","color.angle":"Угол градиента","color.palette":"Палитра (правый клик = 2-й цвет)","light.title":"Свет и блеск","light.intensity":"Яркость света","light.dir":"Направление света","light.gloss":"Глянец","light.glow":"Внешнее свечение","shadow.title":"Тень","shadow.drop":"Падающая тень","shadow.inner":"Внутреннее затенение","details.title":"Детали","details.papers":"Листы внутри папки","details.mirror":"Ярлык справа (зеркально)","details.glass":"Матовое стекло спереди","details.border":"Обводка","png.title":"Изображение PNG","png.none":"Нет","png.inside":"Наружу","png.front":"Эмблема","png.load":"Загрузить PNG…","png.scale":"Размер","png.rot":"Поворот","png.shadow":"Тень изображения","png.emblem_style":"Стиль эмблемы","emblem.original":"Исходные цвета","emblem.gravado":"Тиснение","emblem.branco":"Белый силуэт","export.ico":"Экспорт значка (.ico)","export.png":"Экспорт PNG","export.apply":"Применить к папке…","export.remove":"Убрать значок с папки…","export.repair":"Восстановить значки папок…","settings.title":"Настройки","settings.language":"Язык","settings.animations":"Неоновые анимации","settings.reduce":"Меньше эффектов (без свечения и анимации)","settings.intensity":"Насыщенность темы","settings.export":"Экспорт","settings.export_dir":"Папка экспорта по умолчанию","settings.png_size":"Размер PNG по умолчанию","settings.ico_sizes":"Размеры внутри .ico","settings.restore":"По умолчанию","about.desc":"Красивые значки папок с цветами, градиентами, обложками, светом, тенями и PNG — экспорт в .ico или .png для Windows и Linux.","about.meaning":"«Dosye» означает «папка» на гаитянском креольском. 🇭🇹","about.site":"Официальный сайт","about.project":"Проект на GitHub","about.donate":"Поддержать","about.license":"Лицензия: GPL-3.0","help.title":"Справка","help.shortcuts.title":"Горячие клавиши","repair.title":"Восстановление значков папок","act.export_ico":"Экспорт значка (.ico)","act.export_png":"Экспорт PNG","act.open_preset":"Открыть пресет","act.save_preset":"Сохранить пресет","act.surprise":"Удиви меня (случайный дизайн)","act.search":"Поиск форм","act.settings":"Настройки","act.help":"Справка","act.quit":"Выход","_language":"Русский"},"help":{"start.title":"Начало работы","start.body":"1. Выберите <b>форму</b> слева. 2. Настройте <b>заливку</b> и эффекты справа. 3. Нажмите <b>Export icon (.ico)</b> <span class=\"nat\">(Экспорт значка (.ico))</span> или <b>Apply icon to a folder</b> <span class=\"nat\">(Применить к папке)</span>. Нет идей? Нажмите <b>Surprise me</b> <span class=\"nat\">(Удиви меня)</span>.","shapes.title":"Формы","shapes.body":"51 форма в шести категориях. Используйте кнопки категорий или поле поиска. Миниатюры всегда показывают ваши текущие цвета.","fill.title":"Цвет, градиент и обложка","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Цвет / градиент)</span> окрашивает папку одним или двумя цветами (правый клик по цвету палитры задаёт второй). <b>Image (cover)</b> <span class=\"nat\">(Изображение)</span> использует любое фото или текстуру: на всю папку или только на перед, в режимах «Заполнить», «Вписать» или «Плитка» — затем масштабируйте, двигайте (перетаскиванием в предпросмотре), тонируйте и смешивайте с цветом.","png.title":"PNG: наружу или эмблема","png.body":"Загрузите PNG (или перетащите его на предпросмотр). <b>Coming out</b> <span class=\"nat\">(Наружу)</span> помещает его между задом и передом, словно он выглядывает из папки. <b>Emblem</b> <span class=\"nat\">(Эмблема)</span> печатает его спереди — в исходных цветах, с тиснением или белым силуэтом. Двигайте его в предпросмотре, колесо мыши меняет размер; удерживайте <b>Shift</b>, чтобы переключаться между PNG и обложкой.","effects.title":"Свет, тень и детали","effects.body":"Настраивайте яркость и направление света, глянец, внешнее свечение, падающую тень, внутреннее затенение, листы внутри, матовое стекло, обводку и зеркальный ярлык (справа). Всё работает с любой формой.","export.title":"Экспорт","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Экспорт значка (.ico))</span> создаёт один файл с несколькими размерами (от 16 до 256 px — выберите в Настройках). <b>Export PNG</b> <span class=\"nat\">(Экспорт PNG)</span> сохраняет изображения 256, 512 или 1024 px с прозрачностью.","folder.title":"Значок для папки","folder.body":"Dosye записывает значок <b>внутрь папки</b> сразу во всех форматах: скрытый .ico с desktop.ini (Windows), скрытый PNG с файлом .directory (KDE Dolphin, PCManFM-Qt) и в Linux — настройку GIO, которую используют GNOME Файлы, Nemo, Caja и Thunar. Поэтому одна и та же папка показывает значок и в Windows, и в Linux, даже на флешке. Нажмите F5, если Проводник не обновился. <b>Remove icon from a folder</b> <span class=\"nat\">(Убрать значок с папки)</span> удаляет всё это.","repair.title":"Значок пропал после копирования? Восстановите","repair.body":"Windows показывает значок папки, только пока у папки есть особый атрибут, а копирование Проводником, zip-архивы, синхронизация с облаком или копирование из Linux могут его потерять. GNOME Файлы, Nemo, Caja и Thunar хранят настройку значка на каждом компьютере отдельно, так что она тоже не переносится. Зато файлы значка переносятся вместе с папкой: нажмите <b>Repair folder icons</b> <span class=\"nat\">(Восстановить значки папок…)</span>, выберите папку или весь диск, и Dosye восстановит все созданные им значки там и во всех вложенных папках. KDE Dolphin и PCManFM-Qt восстановление не нужно. Совет: в Windows <code>xcopy /E /H /K</code> сохраняет атрибут.","presets.title":"Пресеты","presets.body":"<b>Save</b> <span class=\"nat\">(Сохранить)</span> записывает дизайн в файл .dosye.json со встроенными изображениями, поэтому он работает на любом компьютере. <b>Open</b> <span class=\"nat\">(Открыть)</span> читает и пресеты Gerador de Pastas (.pasta.json). Пресет можно также перетащить на предпросмотр."},"page":{"nav_download":"Скачать","nav_tutorial":"Руководство","nav_links":"Ссылки","lang_label":"Язык","kicker":"Бесплатно и с открытым кодом · Windows и Linux","cta_windows":"Скачать для Windows","cta_linux":"Скачать для Linux","cta_github":"Открыть на GitHub","version":"Версия","dl_title":"Скачать","dl_sub":"Портативно — ничего не нужно устанавливать. Выберите систему:","dl_exe":"Windows 10/11 · 64 бита · один портативный файл: запуск двойным щелчком.","dl_appimage":"Linux x86_64 · сделайте исполняемым и запустите.","dl_targz":"Linux x86_64 · распакуйте и запустите ./dosye — или ./install.sh для пункта в меню (без root).","dl_all":"Все выпуски","smart_title":"Windows SmartScreen","smart_body":"Файл пока не подписан цифровой подписью, поэтому Windows может показать «Система Windows защитила ваш компьютер». Нажмите {more}, затем {run}.","linux_cmd":"В Linux:","tut_title":"Руководство","tut_sub":"Всё, что умеет Dosye, шаг за шагом.","where":"Где","controls":"Элементы","s_first":"Загрузка и первый запуск","first_text":"Откройте Dosye: слева формы, в центре живой предпросмотр (под ним реальные размеры значка), справа панель оформления. Любое изменение видно сразу.","s_colors":"Цвета и градиенты","colors_text":"В разделе {fill} выберите {color}. Задайте основной цвет, включите градиент для второго цвета и настройте угол. Щелчок по цвету палитры — основной цвет, правый щелчок — второй.","settings_text":"Откройте {settings} кнопкой-шестерёнкой в шапке. Выбор сохраняется для пользователя.","st_lang":"любой из 15 языков — весь интерфейс меняется сразу.","st_anim":"мерцающие звёзды, «дышащее» свечение и плавные переходы; можно выключить в любой момент.","st_reduce":"плоский статичный интерфейс для медленных ПК или удалённого рабочего стола.","st_intensity":"насколько ярко выглядит неоновая тема.","st_export":"папка экспорта по умолчанию, размер PNG по умолчанию и размеры внутри .ico.","about_text":"{help} объясняет каждую функцию и перечисляет горячие клавиши. {about} показывает версию, лицензию и ссылки на сайт, проект и пожертвования.","tbl_title":"Что переносится вместе с папкой","tbl_situation":"Ситуация","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Файлы / Nemo / Caja / Thunar","r1":"Значок применён Dosye прямо на флешке (из Windows или Linux), флешка открыта на другом ПК","r2":"Папка скопирована Windows → флешка → Windows через Проводник","r3":"Папка скопирована через xcopy /E /H /K (сохраняет атрибуты)","r4":"Папка скопирована с Linux-диска (ext4/btrfs) в Windows","r5":"Windows → Linux","r6":"zip-архивы, OneDrive / Google Drive / Dropbox","c_auto":"автоматически","c_repair":"Восстановить","c_once":"Восстановить один раз на ПК","c_maybe":"автоматически, если атрибут сохранился, иначе Восстановить","c_hidden":"автоматически, если скрытые файлы сохранены","legend":"✅ работает само · 🔧 один щелчок по {repair}","links_title":"Ссылки","l_site":"Официальный сайт","l_repo":"Исходный код на GitHub","l_releases":"Выпуски и изменения","l_donate":"Поддержать проект","footer":"Dosye — свободная программа под лицензией GPL-3.0. Сделано с ♥ — cleitinhodev.","top":"Наверх","shot_hint":"Нажмите, чтобы увеличить","meaning":"«Dosye» на гаитянском креольском означает «папка»."},"win":["Подробнее","Выполнить в любом случае"]},"ja":{"ui":{"app.tagline":"美しいフォルダーアイコンを自由に — 光、影、画像、.ico 書き出し", う意味です。🇭🇹","about.site":"公式サイト","about.project":"GitHub のプロジェクト","about.donate":"寄付","about.license":"ライセンス: GPL-3.0","help.title":"ヘルプ","help.shortcuts.title":"キーボードショートカット","repair.title":"フォルダーアイコンの修復","act.export_ico":"アイコンを書き出す (.ico)","act.export_png":"PNG を書き出す","act.open_preset":"プリセットを開く","act.save_preset":"プリセットを保存","act.surprise":"おまかせ (ランダムデザイン)","act.search":"形を検索","act.settings":"設定","act.help":"ヘルプ","act.quit":"終了","_language":"日本語"},"help":{"start.title":"はじめに","start.body":"1. 左側で<b>Shapes</b> <span class=\"nat\">(形)</span>を選びます。2. 右側で<b>Fill</b> <span class=\"nat\">(塗り)</span>と効果を調整します。3. <b>Export icon (.ico)</b> <span class=\"nat\">(アイコンを書き出す (.ico))</span> または <b>Apply icon to a folder</b> <span class=\"nat\">(フォルダーに適用)</span> をクリックします。迷ったら <b>Surprise me</b> <span class=\"nat\">(おまかせ)</span> を押してみてください。","shapes.title":"形","shapes.body":"6 つのカテゴリーに 51 種類の形があります。カテゴリーボタンを使うか、検索欄に入力してください (英語名でも検索できます)。サムネイルは常に現在の色で表示されます。","fill.title":"色、グラデーション、カバー","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(色 / グラデーション)</span> はフォルダーを 1 色または 2 色で塗ります (パレットの色を右クリックすると 2 色目になります)。<b>Image (cover)</b> <span class=\"nat\">(画像 (カバー))</span> では好きな写真やテクスチャを使えます: フォルダー全体か前面のみに適用し、全体・合わせる・タイルを選んで、ズーム、移動 (プレビューでドラッグ)、着色、色との合成ができます。","png.title":"PNG 画像: 飛び出す / エンブレム","png.body":"PNG を読み込みます (プレビューにドロップしても OK)。<b>Coming out</b> <span class=\"nat\">(飛び出す)</span> は背面と前面の間に置き、フォルダーからのぞいているように見せます。<b>Emblem</b> <span class=\"nat\">(エンブレム)</span> は前面に元の色、浮き彫り、白いシルエットのいずれかで印刷します。プレビューでドラッグし、ホイールでサイズ変更。<b>Shift</b> を押すと PNG とカバーを切り替えます。","effects.title":"光、影、ディテール","effects.body":"光の強さと向き、つや、外側の光彩、ドロップシャドウ、内側の陰影、中の書類、すりガラスの前面、輪郭線、右側タブ (反転) を調整できます。すべての形で使えます。","export.title":"書き出し","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(アイコンを書き出す (.ico))</span> は複数サイズ (16〜256 px、設定で選択) を 1 つのファイルにまとめます。<b>Export PNG</b> <span class=\"nat\">(PNG を書き出す)</span> は 256、512、1024 px の透過画像を保存します。","folder.title":"フォルダーにアイコンを適用","folder.body":"Dosye はアイコンをすべての形式でまとめて<b>フォルダーの中</b>に書き込みます：隠し .ico と desktop.ini（Windows）、隠し PNG と .directory ファイル（KDE Dolphin、PCManFM-Qt）、さらに Linux では GNOME ファイル・Nemo・Caja・Thunar が使う GIO の設定。そのため同じフォルダーが Windows でも Linux でも、USB メモリ上でもアイコン付きで表示されます。エクスプローラーが更新されない場合は F5 を押してください。<b>フォルダーからアイコンを削除</b>でこれらをすべて消せます。","repair.title":"コピー後にアイコンが消えたら修復","repair.body":"Windows はフォルダーに特別な属性があるときだけアイコンを表示しますが、エクスプローラーでのコピー、zip、クラウド同期、Linux からのコピーでこの属性が失われることがあります。GNOME ファイル・Nemo・Caja・Thunar はアイコン設定をコンピューターごとに保存するため、こちらも引き継がれません。一方、アイコンのファイルはフォルダーと一緒に移動します。<b>Repair folder icons</b> <span class=\"nat\">(フォルダーアイコンを修復…)</span>をクリックしてフォルダーかドライブ全体を選ぶと、Dosye がそこに作ったアイコンをすべてのサブフォルダーで復元します。KDE Dolphin と PCManFM-Qt は修復不要です。ヒント：Windows では <code>xcopy /E /H /K</code> で属性を保ったままコピーできます。","presets.title":"プリセット","presets.body":"<b>Save</b> <span class=\"nat\">(保存)</span> するとデザインが画像込みの .dosye.json ファイルになり、どのパソコンでも使えます。<b>Open</b> <span class=\"nat\">(開く)</span> では Gerador de Pastas のプリセット (.pasta.json) も読み込めます。プリセットをプレビューにドロップすることもできます。"},"page":{"nav_download":"ダウンロード","nav_tutorial":"チュートリアル","nav_links":"リンク","lang_label":"言語","kicker":"無料・オープンソース · Windows と Linux","cta_windows":"Windows 版をダウンロード","cta_linux":"Linux 版をダウンロード","cta_github":"GitHub で見る","version":"バージョン","dl_title":"ダウンロード","dl_sub":"ポータブル版 — インストール不要。お使いのシステムを選んでください：","dl_exe":"Windows 10/11 · 64 ビット · ポータブルな単一ファイル：ダブルクリックで起動。","dl_appimage":"Linux x86_64 · 実行権限を付けて起動。","dl_targz":"Linux x86_64 · 展開して ./dosye を実行 — メニューに追加するなら ./install.sh（root 不要）。","dl_all":"すべてのリリース","smart_title":"Windows SmartScreen","smart_body":"実行ファイルはまだデジタル署名されていないため、Windows に「Windows によって PC が保護されました」と表示されることがあります。{more} をクリックし、続けて {run} をクリックしてください。","linux_cmd":"Linux では：","tut_title":"チュートリアル","tut_sub":"Dosye でできることを順番に。","where":"場所","controls":"操作項目","s_first":"ダウンロードと初回起動","first_text":"Dosye を開くと、左に形の一覧、中央にライブプレビュー（下に実際のアイコンサイズ）、右にデザインパネルがあります。変更はすぐに反映されます。","s_colors":"色とグラデーション","colors_text":"{fill} で {color} を選びます。メインの色を決め、グラデーションをオンにして 2 番目の色を加え、角度を調整します。パレットの色をクリ ，分为六个类别。使用类别按钮或在搜索框中输入 (也可以用英文名称搜索)。缩略图始终使用你当前的颜色。","fill.title":"颜色、渐变与封面","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(颜色 / 渐变)</span> 用一种或两种颜色为文件夹上色 (右键点击调色板中的颜色可设为第二颜色)。<b>Image (cover)</b> <span class=\"nat\">(图片 (封面))</span> 可使用任意照片或纹理：应用到整个文件夹或仅正面，选择填满、适应或平铺，然后缩放、移动 (在预览中拖动)、着色并与颜色混合。","png.title":"PNG 图片：探出或徽标","png.body":"载入 PNG (或拖放到预览上)。<b>Coming out</b> <span class=\"nat\">(探出)</span> 会把它放在背面和正面之间，就像从文件夹里探出头来。<b>Emblem</b> <span class=\"nat\">(徽标)</span> 会把它以原始颜色、浮雕或白色剪影印在正面。在预览中拖动它，用滚轮调整大小；按住 <b>Shift</b> 可在 PNG 和封面之间切换。","effects.title":"光照、阴影与细节","effects.body":"可调整光照强度和方向、光泽、外发光、投影、内部阴影、内部纸张、磨砂玻璃正面、描边以及镜像 (右侧) 标签。所有效果适用于每种形状。","export.title":"导出","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(导出图标 (.ico))</span> 会生成一个包含多种尺寸的文件 (16 到 256 px，可在设置中选择)。<b>Export PNG</b> <span class=\"nat\">(导出 PNG)</span> 保存 256、512 或 1024 px 的透明图片。","folder.title":"将图标应用到文件夹","folder.body":"Dosye 会一次性以所有格式把图标写入<b>文件夹内部</b>：隐藏的 .ico 加 desktop.ini（Windows）、隐藏的 PNG 加 .directory 文件（KDE Dolphin、PCManFM-Qt），在 Linux 上还会写入 GNOME 文件、Nemo、Caja 和 Thunar 使用的 GIO 设置。因此同一个文件夹在 Windows 和 Linux 上都会显示图标，放在 U 盘里也一样。如果资源管理器没有刷新，请按 F5。<b>Remove icon from a folder</b> <span class=\"nat\">(移除文件夹图标)</span>会把这些全部删除。","repair.title":"复制后图标不见了？修复它","repair.body":"Windows 只有在文件夹带有特殊属性时才显示文件夹图标，而用文件资源管理器复制、打包成 zip、云同步或从 Linux 复制都可能丢失这个属性。GNOME 文件、Nemo、Caja 和 Thunar 把图标设置保存在每台电脑本地，所以它也不会随文件夹走。但图标文件会跟着文件夹一起走：点击<b>Repair folder icons</b> <span class=\"nat\">(修复文件夹图标…)</span>，选择一个文件夹或整个磁盘，Dosye 就会在其中所有子文件夹里恢复它创建的图标。KDE Dolphin 和 PCManFM-Qt 无需修复。提示：在 Windows 上用 <code>xcopy /E /H /K</code> 复制可以保留该属性。","presets.title":"预设","presets.body":"<b>Save</b> <span class=\"nat\">(保存)</span> 会将设计存为内嵌图片的 .dosye.json 文件，在任何电脑上都能使用。<b>Open</b> <span class=\"nat\">(打开)</span> 也能读取 Gerador de Pastas 的预设 (.pasta.json)。你也可以把预设拖放到预览上。"},"page":{"nav_download":"下载","nav_tutorial":"教程","nav_links":"链接","lang_label":"语言","kicker":"免费开源 · Windows 和 Linux","cta_windows":"下载 Windows 版","cta_linux":" title":"키보드 단축키","repair.title":"폴더 아이콘 복구","act.export_ico":"아이콘 내보내기 (.ico)","act.export_png":"PNG 내보내기","act.open_preset":"프리셋 열기","act.save_preset":"프리셋 저장","act.surprise":"랜덤 생성 (무작위 디자인)","act.search":"모양 검색","act.settings":"설정","act.help":"도움말","act.quit":"종료","_language":"한국어"},"help":{"start.title":"시작하기","start.body":"1. 왼쪽에서 <b>Shapes</b> <span class=\"nat\">(모양)</span>을 고릅니다. 2. 오른쪽에서 <b>Fill</b> <span class=\"nat\">(채우기)</span>와 효과를 조정합니다. 3. <b>Export icon (.ico)</b> <span class=\"nat\">(아이콘 내보내기 (.ico))</span> 또는 <b>Apply icon to a folder</b> <span class=\"nat\">(폴더에 아이콘 적용)</span>을 클릭합니다. 아이디어가 없나요? <b>Surprise me</b> <span class=\"nat\">(랜덤 생성)</span>을 눌러 보세요.","shapes.title":"모양","shapes.body":"6개 카테고리에 51가지 모양이 있습니다. 카테고리 버튼을 사용하거나 검색창에 입력하세요 (영어 이름으로도 검색 가능). 썸네일은 항상 현재 색상을 사용합니다.","fill.title":"색상, 그라데이션, 커버","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(색상 / 그라데이션)</span>은 폴더를 한두 가지 색으로 칠합니다 (팔레트 색을 우클릭하면 두 번째 색으로 지정). <b>Image (cover)</b> <span class=\"nat\">(이미지 (커버))</span>는 어떤 사진이나 텍스처든 사용할 수 있습니다: 폴더 전체 또는 앞면에만 적용하고, 채우기·맞추기·바둑판 중 하나를 고른 뒤 확대, 이동(미리보기에서 드래그), 색 입히기, 색상 혼합을 할 수 있습니다.","png.title":"PNG 이미지: 튀어나옴 또는 엠블럼","png.body":"PNG를 불러오세요 (미리보기에 놓아도 됩니다). <b>Coming out</b> <span class=\"nat\">(튀어나옴)</span>은 이미지를 뒷면과 앞면 사이에 두어 폴더에서 빼꼼 나온 것처럼 보이게 합니다. <b>Emblem</b> <span class=\"nat\">(엠블럼)</span>은 앞면에 원래 색상, 양각 또는 흰색 실루엣으로 인쇄합니다. 미리보기에서 드래그하고 휠로 크기를 바꾸세요. <b>Shift</b>를 누르면 PNG와 커버 사이를 전환합니다.","effects.title":"빛, 그림자, 세부","effects.body":"빛의 세기와 방향, 광택, 외부 광선, 드롭 섀도, 내부 음영, 안쪽 종이, 반투명 유리 앞면, 윤곽선, 반전(오른쪽) 탭을 조정할 수 있습니다. 모든 모양에서 작동합니다.","export.title":"내보내기","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(아이콘 내보내기 (.ico))</span>는 여러 크기(16~256 px, 설정에서 선택)를 하나의 파일로 저장합니다. <b>Export PNG</b> <span class=\"nat\">(PNG 내보내기)</span>는 256, 512 또는 1024 px 투명 이미지를 저장합니다.","folder.title":"폴더에 아이콘 적용","folder.body":"Dosye는 아이콘을 모든 형식으로 한 번에 <b>폴더 안에</b> 씁니다: desktop.ini와 숨김 .ico(Windows), .directory 파일과 숨김 PNG(KDE Dolphin, PCManFM-Qt), 그리고 Linux에서는 GNOME 파일, Nemo, Caja, Thunar가 쓰는 GIO 설정. 그래서 같은 폴더가 Windows와 Linux에서, USB 메모리에서도 아이콘을 보여 줍니다. 탐색기가 새로 고쳐지지 않으면 F5를 누르세요. <b>폴더에서 아이콘 제거</b>는 이 모두를 지웁니다.","repair.title":"복사 후 아이콘이 사라졌나요? 복구하세요","repair.body":"Windows는 폴더에 특별한 속성이 있을 때만 폴더 아이콘을 보여 주는데, 파일 탐색기 복사, zip 파일, 클라우드 동기화, Linux에서의 복사로 이 속성이 사라질 수 있습니다. GNOME 파일, Nemo, Caja, Thunar는 아이콘 설정을 컴퓨터마다 따로 저장하므로 이것도 따라가지 않습니다. 하지만 아이콘 파일은 폴더와 함께 이동합니다: <b>Repair folder icons</b> <span class=\"nat\">(폴더 아이콘 복구…)</span>를 누르고 폴더나 드라이브 전체를 고르면, Dosye가 그 안의 모든 하위 폴더에서 자신이 만든 아이콘을 복구합니다. KDE Dolphin과 PCManFM-Qt는 복구가 필요 없습니다. 팁: Windows에서는 <code>xcopy /E /H /K</code>로 복사하면 속성이 유지됩니다.","presets.title":"프리셋","presets.body":"<b>Save</b> <span class=\"nat\">(저장)</span>하면 디자인이 이미지가 포함된 .dosye.json 파일로 저장되어 어느 컴퓨터에서나 사용할 수 있습니다. <b>Open</b> <span class=\"nat\">(열기)</span>는 Gerador de Pastas 프리셋(.pasta.json)도 읽습니다. 프리셋을 미리보기에 놓을 수도 있습니다."},"page":{"nav_download":"다운로드","nav_tutorial":"튜토리얼","nav_links":"링크","lang_label":"언어","kicker":"무료 오픈 소스 · Windows와 Linux","cta_windows":"Windows용 다운로드","cta_linux":"Linux용 다운로드","cta_github":"GitHub에서 보기","version":"버전","dl_title":"다운로드","dl_sub":"포터블 — 설치가 필요 없습니다. 시스템을 고르세요:","dl_exe":"Windows 10/11 · 64비트 · 포터블 단일 파일: 더블 클릭으로 실행.","dl_appimage":"Linux x86_64 · 실행 권한을 주고 실행.","dl_targz":"Linux x86_64 · 압축을 풀고 ./dosye 실행 — 메뉴에 추가하려면 ./install.sh (root 불필요).","dl_all":"모든 릴리스","smart_title":"Windows SmartScreen","smart_body":"실행 파일에 아직 디지털 서명이 없어서 Windows가 “Windows의 PC 보호”를 표시할 수 있습니다. {more}를 누른 다음 {run}을 누르세요.","linux_cmd":"Linux에서:","tut_title":"튜토리얼","tut_sub":"Dosye로 할 수 있는 모든 것을 단계별로.","where":"위치","controls":"컨트롤","s_first":"다운로드와 첫 실행","first_text":"Dosye를 열면 왼쪽에 모양, 가운데에 실시간 미리 보기(아래에 실제 아이콘 크기), 오른쪽에 디자인 패널이 있습니다. 모든 변경이 즉시 보입니다.","s_colors":"색상과 그라데이션","colors_text":"{fill}에서 {color}를 고릅니다. 기본 색을 정하고, 그라데이션을 켜서 두 번째 색을 더하고 각도를 조절하세요. 팔레트 색을 클릭하면 기본 색, 오른쪽 클릭하면 두 번째 색이 됩니다.","settings_text":"상단의 톱니바퀴 버튼으로 {settings}을 엽니다. 선택은 사용자별로 저장됩니다.","st_lang":"15개 언어 중 선택 — 전체 화면이 즉시 바뀝니다.","st_anim":"반짝이는 별, 숨 쉬는 빛, 부드러운 전환. 언제든 끌 수 있습니다.","st_reduce":"느린 PC나 원격 데스크톱을 위한 평면적이고 정적인 화면.","st_intensity":"네온 테마의 강도.","st_export":"기본 내보내기 폴더, 기본 PNG 크기, .ico에 넣을 크기.","about_text":"{help}에서 모든 기능과 키보드 단축키를 볼 수 있습니다. {about}에는 버전, 라이선스, 웹사이트·프로젝트·후원 링크가 있습니다.","tbl_title":"폴더와 함께 이동하는 것","tbl_situation":"상황","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME 파일 / Nemo / Caja / Thunar","r1":"Dosye로 USB 메모리에 직접 아이콘 적용(Windows나 Linux에서) 후 다른 PC에서 열기","r2":"파일 탐색기로 Windows → USB 메모리 → Windows 복사","r3":"xcopy /E /H /K로 복사(속성 유지)","r4":"Linux 디스크(ext4/btrfs)에서 Windows로 복사","r5":"Windows → Linux","r6":"zip 압축 파일, OneDrive / Google 드라이브 / Dropbox","c_auto":"자동","c_repair":"복구","c_once":"PC마다 한 번 복구","c_maybe":"속성이 남아 있으면 자동, 아니면 복구","c_hidden":"숨김 파일이 유지되면 자동","legend":"✅ 자동으로 작동 · 🔧 {repair} 한 번 클릭","links_title":"링크","l_site":"공식 웹사이트","l_repo":"GitHub 소스 코드","l_releases":"릴리스와 변경 사항","l_donate":"프로젝트 후원","footer":"Dosye는 GPL-3.0 라이선스의 자유 소프트웨어입니다. cleitinhodev가 ♥을 담아 만들었습니다.","top":"맨 위로","shot_hint":"클릭하여 확대","meaning":"“Dosye”는 아이티 크리올어로 “폴더”라는 뜻입니다."},"win":["추가 정보","실행"]}};

er icons…","settings.title":"Settings","settings.language":"Language","settings.animations":"Neon animations","settings.reduce":"Reduce effects (no glow, no animation)","settings.intensity":"Theme intensity","settings.export":"Export","settings.export_dir":"Default export folder","settings.png_size":"Default PNG size","settings.ico_sizes":"Sizes inside the .ico","settings.restore":"Restore defaults","about.desc":"Beautiful custom folder icons with colours, gradients, image covers, light, shadow and PNG images — exported as .ico or .png, for Windows and Linux.","about.meaning":"“Dosye” means “folder” in Haitian Creole. 🇭🇹","about.site":"Official website","about.project":"Project on GitHub","about.donate":"Donate","about.license":"License: GPL-3.0","help.title":"Help","help.shortcuts.title":"Keyboard shortcuts","repair.title":"Repair folder icons","act.export_ico":"Export icon (.ico)","act.export_png":"Export PNG","act.open_preset":"Open preset","act.save_preset":"Save preset","act.surprise":"Surprise me (random design)","act.search":"Search shapes","act.settings":"Settings","act.help":"Help","act.quit":"Quit","_language":"English"};
const SIZES = {"main": [1366, 768], "shapes": [1366, 768], "colors": [1366, 768], "effects": [1366, 768], "cover": [1366, 768], "png_coming_out": [1366, 768], "emblem": [1366, 768], "export": [1366, 768], "apply": [1366, 768], "repair": [560, 403], "settings": [520, 638], "about": [560, 500], "help": [760, 640], "design_hero": [512, 512], "design_emblem": [512, 512], "design_open": [512, 512], "icon": [256, 256], "favicon": [256, 256], "hero": [1672, 941], "character": [900, 507]};
const SHORTCUTS = [["Ctrl+E", "act.export_ico"], ["Ctrl+Shift+E", "act.export_png"], ["Ctrl+O", "act.open_preset"], ["Ctrl+S", "act.save_preset"], ["Ctrl+R", "act.surprise"], ["Ctrl+F", "act.search"], ["Ctrl+,", "act.settings"], ["F1", "act.help"], ["Ctrl+Q", "act.quit"]];
const ORDER = ["ht","fr","gcf","mfe","en","pt_BR","es","de","it","pl","tr","ru","ja","zh_CN","ko"];
const A = f => C.assets + f;
const V = s => s.replace(/\{version\}/g, C.version);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => s.replace(/…$/,"").replace(/:$/,"");
let L = "en", D = DATA.en;

function pickLanguage(){
  const q = new URLSearchParams(location.search).get("lang");
  const saved = (()=>{ try { return localStorage.getItem("dosye-tutorial-lang"); } catch(e){ return null; } })();
  const want = [q, saved, ...(navigator.languages || [navigator.language || ""])].filter(Boolean);
  for (const w of want){
    const n = w.replace("-","_");
    if (DATA[n]) return n;
    const lo = n.toLowerCase();
    for (const k of ORDER){ if (k.toLowerCase() === lo) return k; }
    const base = lo.split("_")[0];
    if (base === "pt") return "pt_BR";
    if (base === "zh") return "zh_CN";
    for (const k of ORDER){ if (k.toLowerCase().split("_")[0] === base) return k; }
  }
  return DATA[C.defaultLanguage] ? C.defaultLanguage : "en";
}
const P = k => (D.page[k] ?? DATA.en.page[k] ?? k);
/* UI term: English label first, native label in parentheses (only when different) */
function ui(key, cls){
  const en = strip(EN[key] || key), nat = strip(D.ui[key] || en);
  const n = (L !== "en" && nat.toLowerCase() !== en.toLowerCase()) ? ` <span class="nat">(${esc(nat)})</span>` : "";
  return `<span class="${cls || "ui"}"><b>${esc(en)}</b>${n}</span>`;
}
const chip = k => ui(k, "chip");
function fill(str, map){ return esc(str).replace(/\{(\w+)\}/g, (m, k) => map[k] !== undefined ? map[k] : m); }
function winTerm(i){
  const en = DATA.en.win[i], nat = D.win[i];
  return `<b>${esc(en)}</b>` + (nat !== en ? ` <span class="nat">(${esc(nat)})</span>` : "");
}
function shot(name, alt, cls){
  const s = SIZES[name] || [1366, 768];
  return `<figure class="shot ${cls||""}" data-full="${A("shot-"+name+".webp")}"><img loading="lazy" decoding="async" src="${A("shot-"+name+".webp")}" width="${s[0]}" height="${s[1]}" alt="${esc(alt)}"><figcaption>🔍 ${esc(P("shot_hint"))}</figcaption></figure>`;
}
const where = keys => `<div class="where"><span class="lbl">${esc(P("where"))}</span>${keys.map(chip).join(' <span class="arrow">›</span> ')}</div>`;
const ctrls = keys => `<div class="where"><span class="lbl">${esc(P("controls"))}</span></div><div class="ctrls">${keys.map(chip).join("")}</div>`;
const H = (sec, part) => D.help[sec + "." + part];

function steps(){
  const S = [];
  S.push({t: P("s_first"), body: `<p>${esc(P("first_text"))}</p><p>${H("start","body")}</p>`, shots: [["main","Dosye main window"]]});
  S.push({t: H("shapes","title"), body: `<p>${H("shapes","body")}</p>` + where(["shapes.title"]) + ctrls(["cat.all","cat.classic","cat.modern","cat.retro","cat.office","cat.fun","cat.special","shapes.search","hdr.surprise"]), shots: [["shapes","Shapes and categories"]]});
  S.push({t: P("s_colors"), body: `<p>${fill(P("colors_text"), {fill: ui("fill.title"), color: ui("fill.color")})}</p>` + ctrls(["color.main","color.gradient","color.second","color.angle","color.palette"]), shots: [["colors","Colours and gradient"]]});
  S.push({t: H("effects","title"), body: `<p>${H("effects","body")}</p>` + where(["light.title"]) + ctrls(["light.intensity","light.dir","light.gloss","light.glow","shadow.drop","shadow.inner","details.papers","details.glass","details.border","details.mirror"]), shots: [["effects","Light and shadow"]]});
  S.push({t: H("fill","title"), body: `<p>${H("fill","body")}</p>` + where(["fill.title","fill.image","cover.choose"]) + ctrls(["cover.examples","cover.apply_to","fit.cobrir","fit.ajustar","fit.lado","cover.zoom","cover.tint","cover.blend","cover.back_dark"]), shots: [["cover","Image cover"]]});
  S.push({t: H("png","title"), body: `<p>${H("png","body")}</p>` + where(["png.title","png.load"]) + ctrls(["png.inside","png.front","png.scale","png.rot","png.shadow","png.emblem_style","emblem.original","emblem.gravado","emblem.branco"]), shots: [["png_coming_out","PNG coming out of the folder"],["emblem","PNG as an emblem"]], two: true});
  S.push({t: H("export","title"), body: `<p>${H("export","body")}</p>` + ctrls(["export.ico","export.png","settings.ico_sizes","settings.png_size"]), shots: [["export","Export"]]});
  S.push({t: H("folder","title"), body: `<p>${H("folder","body")}</p>` + ctrls(["export.apply","export.remove"]), shots: [["apply","Apply icon to a folder"]]});
  const R = (k)=>P(k);
  const y = `<span class="y">✅ ${esc(R("c_auto"))}</span>`, rp = t => `<span class="r">🔧 ${esc(t)}</span>`;
  const rows = [["r1", y, y, rp(R("c_once"))], ["r2", rp(R("c_maybe")), y, rp(R("c_repair"))], ["r3", y, y, rp(R("c_repair"))],
                ["r4", rp(R("c_repair")), y, rp(R("c_repair"))], ["r5", "—", y, rp(R("c_repair"))], ["r6", rp(R("c_repair")), y + `<br><small>${esc(R("c_hidden"))}</small>`, rp(R("c_repair"))]];
  const table = `<h4 style="margin:22px 0 0;font-size:19px">${esc(R("tbl_title"))}</h4><div class="tbl-wrap"><table><thead><tr><th>${esc(R("tbl_situation"))}</th><th>${esc(R("tbl_win"))}</th><th>${esc(R("tbl_kde"))}</th><th>${esc(R("tbl_gnome"))}</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(R(r[0]))}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("") +
    `</tbody></table></div><p class="legend">${fill(R("legend"), {repair: ui("export.repair")})}</p>`;
  S.push({t: H("repair","title"), body: `<p>${H("repair","body")}</p>` + where(["export.repair"]) + `<p style="margin-top:10px"><code>dosye --repair /media/me/PENDRIVE</code> · <code>Dosye.exe --repair E:\\</code></p>`, shots: [["repair","Repair folder icons"]], dialog: true, after: table});
  S.push({t: H("presets","title"), body: `<p>${H("presets","body")}</p>` + ctrls(["hdr.open","hdr.save","hdr.reset","hdr.surprise"]), shots: []});
  const st = [["settings.language","st_lang"],["settings.animations","st_anim"],["settings.reduce","st_reduce"],["settings.intensity","st_intensity"],["settings.export","st_export"]];
  S.push({title_ui: "settings.title",
          body: `<p>${fill(P("settings_text"), {settings: ui("hdr.settings")})}</p><ul class="settings">` + st.map(([k,d]) => `<li>${ui(k)}<div class="d">${esc(P(d))}</div></li>`).join("") + `</ul>`,
          shots: [["settings","Settings dialog"]], dialog: true});
  const kb = `<h4 style="margin:18px 0 0">${esc(D.ui["help.shortcuts.title"])}</h4><div class="kbd-grid">` + SHORTCUTS.map(([k, a]) => `<div><span>${ui(a)}</span><kbd>${esc(k)}</kbd></div>`).join("") + `</div>`;
  S.push({t: null, title_html: `${ui("hdr.help")} &amp; ${ui("hdr.about")}`, body: `<p>${fill(P("about_text"), {help: ui("hdr.help"), about: ui("hdr.about")})}</p><p>${esc(D.ui["about.desc"])}</p>` + kb,
          shots: [["about","About dialog"],["help","Help dialog"]], two: true});
  return S;
}

function render(){
  D = DATA[L]; document.documentElement.lang = L.replace("_","-");
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = P(e.dataset.t));
  document.getElementById("tagline").textContent = D.ui["app.tagline"];
  document.querySelectorAll(".vnum").forEach(e => e.textContent = C.version);
  document.getElementById("smart").innerHTML = fill(P("smart_body"), {more: winTerm(0), run: winTerm(1)});
  const html = steps().map((s, i) => {
    const title = s.title_html || (s.title_ui ? ui(s.title_ui) : s.t);
    const shots = s.shots.length ? `<div class="shots ${s.two ? "two" : ""} rv d1">${s.shots.map(([n, alt]) => shot(n, alt, s.dialog ? "dialog-shot" : "")).join("")}</div>` : `<div class="rv d1" style="display:grid;place-items:center"><img src="${A("design-emblem.webp")}" width="300" height="300" alt="" style="width:min(300px,70%);filter:drop-shadow(0 20px 40px rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(139,92,255,.35))"></div>`;
    return `<article class="step" id="step-${i+1}"><div class="txt rv"><div class="num">${i+1}</div><h3>${title}</h3><div class="body">${s.body}</div></div>${shots}${s.after ? `<div class="after rv">${s.after}</div>` : ""}</article>`;
  }).join("");
  document.getElementById("steps").innerHTML = html;
  const lk = [["🌐","l_site",C.links.site],["💻","l_repo",C.links.repo],["📦","l_releases",C.links.releases],["💜","l_donate",C.links.donate]];
  document.getElementById("linksGrid").innerHTML = lk.map(([i,k,u],n) => `<a class="card rv d${n%3}" href="${esc(u)}" target="_blank" rel="noopener"><div class="ico">${i}</div><h3>${esc(P(k))}</h3><p>${esc(u.replace(/^https?:\/\//,""))}</p></a>`).join("");
  bindShots(); reveal();
}

function setup(){
  const fav = document.getElementById("fav"); fav.href = A("favicon.png");
  ["brandIcon","footIcon"].forEach(id => document.getElementById(id).src = A("dosye-icon.webp"));
  document.getElementById("heroBg").style.backgroundImage = `url("${A("hero-bg.webp")}")`;
  const hf = document.getElementById("heroFolder"); hf.src = A("design-hero.webp"); hf.width = 512; hf.height = 512;
  const dc = document.getElementById("decoChar");
  if (SIZES.character){ dc.src = A("character.webp"); } else { dc.remove(); }
  const dl = {Win: V(C.downloads.windows), App: V(C.downloads.appimage), Tar: V(C.downloads.targz)};
  for (const k in dl){ document.getElementById("d"+k).href = dl[k]; document.getElementById("f"+k).textContent = dl[k].split("/").pop(); }
  document.getElementById("ctaWin").href = dl.Win;
  document.getElementById("ctaGit").href = C.links.repo;
  document.getElementById("relLink").href = C.links.releases;
  const fs = document.getElementById("footSite"); fs.href = C.links.site; fs.textContent = C.links.site.replace(/^https?:\/\//,"").replace(/\/$/,"");
  const app = dl.App.split("/").pop(), tar = dl.Tar.split("/").pop();
  document.getElementById("linuxCmd").textContent = `chmod +x ${app}\n./${app}\n\n# tar.gz\ntar xzf ${tar}\ncd Dosye-*/ && ./dosye      # ./install.sh = menu entry`;
  const sel = document.getElementById("lang");
  sel.innerHTML = ORDER.map(k => `<option value="${k}">${esc(DATA[k].ui._language)}</option>`).join("");
  L = pickLanguage(); sel.value = L;
  sel.addEventListener("change", () => { L = sel.value; try { localStorage.setItem("dosye-tutorial-lang", L); } catch(e){} render(); });
  // stars
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const box = document.getElementById("stars"), n = innerWidth < 700 ? 40 : 90;
  for (let i = 0; i < n; i++){
    const s = document.createElement("i"); s.className = "star";
    s.style.left = Math.random()*100 + "%"; s.style.top = Math.random()*100 + "%";
    const z = Math.random() < .15 ? 3 : (Math.random() < .5 ? 2 : 1); s.style.width = s.style.height = z + "px";
    s.style.animationDelay = (-Math.random()*4) + "s"; s.style.animationDuration = (3 + Math.random()*4) + "s";
    if (Math.random() < .2) s.style.background = s.style.boxShadow = Math.random() < .5 ? "#FFE08A" : "#C084FC";
    if (Math.random() < .2) s.style.boxShadow = `0 0 8px ${s.style.background || "#fff"}`;
    box.appendChild(s);
  }
  // hero parallax (skipped with reduced motion)
  if (!reduce){
    const bg = document.getElementById("heroBg");
    addEventListener("scroll", () => { const y = scrollY; if (y < 1000) bg.style.transform = `scale(1.08) translateY(${y*0.25}px)`; }, {passive:true});
  }
  const tt = document.getElementById("totop");
  addEventListener("scroll", () => tt.classList.toggle("show", scrollY > 700), {passive:true});
  tt.addEventListener("click", () => scrollTo({top:0, behavior: reduce ? "auto" : "smooth"}));
  const lb = document.getElementById("lb");
  lb.addEventListener("click", () => lb.classList.remove("open"));
  addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open"); });
}
function bindShots(){
  const lb = document.getElementById("lb");
  document.querySelectorAll(".shot").forEach(f => f.addEventListener("click", () => { lb.querySelector("img").src = f.dataset.full; lb.querySelector("img").alt = f.querySelector("img").alt; lb.classList.add("open"); }));
}
let io = null;
function reveal(){
  const els = document.querySelectorAll(".rv:not(.in)");
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches){ els.forEach(e => e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin: "0px 0px -8% 0px", threshold: .08});
  els.forEach(e => io.observe(e));
}
setup(); render();
})();
</script>
