<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dosye — Tutorial</title>
<meta name="description" content="Dosye: beautiful custom folder icons for Windows and Linux — tutorial, downloads and links.">
<meta name="theme-color" content="#0C0F30">
<link rel="icon" id="fav" type="image/png" href="assets/favicon.png">
<style>
:root{
  --bg:#070A24; --bg2:#0C0F30; --card:rgba(22,26,80,.55); --line:rgba(150,140,255,.22);
  --text:#ECEBFF; --muted:#A9ADDB; --violet:#8B5CFF; --indigo:#5B3FD8; --lilac:#C084FC;
  --gold:#FFC93C; --gold2:#FFE08A; --cyan:#6FC3FF; --pink:#FF6BCB; --ok:#5EE6A8;
  --r:18px; --maxw:1180px;
  --font: "Inter","Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans JP","Noto Sans SC","Noto Sans KR","Hiragino Sans","Microsoft YaHei","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box} html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--font);overflow-x:hidden}
a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
img{max-width:100%;height:auto;display:block}
code,kbd{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.88em;background:rgba(139,92,255,.16);border:1px solid var(--line);padding:.1em .4em;border-radius:6px}
/* ---------- starfield ---------- */
#sky{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1200px 700px at 80% -10%,rgba(139,92,255,.28),transparent 60%),
  radial-gradient(900px 600px at -10% 30%,rgba(91,63,216,.30),transparent 60%),
  radial-gradient(800px 500px at 60% 110%,rgba(255,201,60,.10),transparent 60%),
  linear-gradient(180deg,#070A24,#0C0F30 40%,#0A0D2A)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;opacity:.7;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(7,10,36,.6);border-bottom:1px solid var(--line)}
.bar{max-width:var(--maxw);margin:auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--text)}
.brand img{width:38px;height:38px;filter:drop-shadow(0 0 10px rgba(139,92,255,.7))}
.brand span{background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.links{display:flex;gap:16px;margin-left:auto}
nav.links a{color:var(--muted);font-weight:600;font-size:15px} nav.links a:hover{color:var(--text);text-decoration:none}
.langsel{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
select{background:#141850;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;cursor:pointer}
select:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:14px;font-weight:800;color:#fff;border:1px solid var(--line);background:rgba(27,32,96,.7);transition:transform .2s,box-shadow .2s,background .2s;cursor:pointer}
.btn:hover{text-decoration:none;transform:translateY(-2px);box-shadow:0 10px 30px rgba(139,92,255,.35)}
.btn.primary{background:linear-gradient(135deg,var(--indigo),var(--violet) 60%,var(--lilac));border-color:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 30px rgba(139,92,255,.45)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#FFB020);color:#2A1800;border-color:transparent;box-shadow:0 8px 30px rgba(255,201,60,.35)}
.btn svg{width:20px;height:20px;flex:none}
.btn.small{padding:8px 14px;font-size:14px;border-radius:11px}
/* ---------- hero ---------- */
.hero{position:relative;min-height:min(92vh,860px);display:flex;align-items:center;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transform:scale(1.08);filter:saturate(1.1)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(90deg,rgba(7,10,36,.94) 0%,rgba(7,10,36,.80) 40%,rgba(20,14,60,.45) 70%,rgba(12,15,48,.55)),
  radial-gradient(ellipse at 75% 40%,rgba(255,122,182,.10),transparent 60%),
  linear-gradient(180deg,rgba(7,10,36,.35),rgba(7,10,36,.15) 55%,var(--bg))}
.hero-in{max-width:var(--maxw);margin:auto;padding:70px 20px 90px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;width:100%}
.kicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);background:rgba(255,201,60,.1);border:1px solid rgba(255,201,60,.35);padding:6px 12px;border-radius:99px}
h1.title{font-size:clamp(54px,9vw,112px);line-height:.95;margin:.25em 0 .15em;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 10%,var(--gold2) 45%,var(--lilac) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(139,92,255,.55))}
.tagline{font-size:clamp(18px,2.2vw,23px);color:#D9D8FF;max-width:560px;margin:0 0 10px}
.meaning{color:var(--muted);font-size:15px;margin:0 0 26px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.ver{margin-top:18px;color:var(--muted);font-size:14px}
.ver b{color:var(--gold2)}
.hero-art{position:relative;display:grid;place-items:center;min-height:380px}
.hero-art .halo{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(139,92,255,.55),rgba(255,201,60,.12) 55%,transparent 70%);filter:blur(10px);animation:breathe 6s ease-in-out infinite}
.hero-art img.folder{position:relative;width:min(440px,100%);filter:drop-shadow(0 30px 50px rgba(0,0,0,.55));animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-16px) rotate(1deg)}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.scroll-cue{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:26px;height:42px;border:2px solid rgba(255,255,255,.45);border-radius:14px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
/* ---------- sections ---------- */
main{position:relative}
section.block{max-width:var(--maxw);margin:auto;padding:80px 20px}
.sec-head{text-align:center;margin-bottom:40px}
.sec-head h2{font-size:clamp(32px,4.5vw,48px);margin:0 0 6px;font-weight:900;background:linear-gradient(90deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head p{color:var(--muted);margin:0;font-size:18px}
.glow-line{height:2px;width:120px;margin:16px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,var(--violet),var(--gold),transparent);box-shadow:0 0 14px var(--violet)}
/* downloads */
.dl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(192,132,252,.6);box-shadow:0 20px 50px rgba(91,63,216,.35),0 0 0 1px rgba(192,132,252,.25) inset}
.card h3{margin:6px 0 4px;font-size:21px}
.card .os{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2)}
.card p{color:var(--muted);margin:0 0 18px;font-size:15px}
.card .file{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:#cfcfff;word-break:break-all;margin-bottom:14px;opacity:.85}
.note{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note .card{padding:20px}
.note h4{margin:0 0 6px;font-size:17px;color:var(--gold2)}
.note p{margin:0;color:var(--muted);font-size:15px}
pre.cmd{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;background:rgba(5,7,26,.7);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;font:13px/1.5 ui-monospace,Consolas,monospace;color:#d8d6ff}
.all-rel{text-align:center;margin-top:18px}
/* tutorial steps */
.step>.after{grid-column:1/-1;margin-top:-14px}
.step>.after table{min-width:640px}
.step>*,.note>*,.dl-grid>*,.links-grid>*,.shots>*{min-width:0}
.step{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:center;padding:46px 0;border-top:1px solid rgba(150,140,255,.12)}
.step:nth-child(even) .txt{order:2}
.num{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;font-weight:900;color:#1a1033;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 24px rgba(255,201,60,.45);margin-bottom:12px}
.step h3{font-size:clamp(24px,3vw,32px);margin:0 0 10px;line-height:1.2}
.step .body{color:#D3D2F5}
.step .body p{margin:0 0 12px}
.step .body b{color:#fff}
.nat{color:var(--gold2);font-weight:500}
.ui{white-space:normal}
.ui b{color:#fff;font-weight:800}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 4px;font-size:14px;color:var(--muted)}
.where .lbl{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--lilac);margin-right:4px}
.chip{display:inline-block;padding:4px 10px;border-radius:9px;background:rgba(139,92,255,.16);border:1px solid rgba(192,132,252,.35);color:#fff;font-size:13.5px}
.chip .nat{font-size:12.5px}
.arrow{color:var(--gold)}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.shot{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 40px rgba(139,92,255,.18);cursor:zoom-in;background:#0b0e2c;transition:transform .35s,box-shadow .35s}
.shot:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 60px rgba(139,92,255,.35)}
.shot figcaption{position:absolute;right:10px;bottom:10px;font-size:12px;background:rgba(7,10,36,.75);padding:3px 9px;border-radius:8px;color:var(--muted);opacity:0;transition:opacity .25s}
.shot:hover figcaption{opacity:1}
.shots{display:grid;gap:14px}
.shots.two{grid-template-columns:minmax(0,1fr)}
.dialog-shot{max-width:520px;margin:auto}
ul.settings{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
ul.settings li{background:rgba(22,26,80,.5);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
ul.settings li .d{color:var(--muted);font-size:15px}
/* table */
.tbl-wrap{margin-top:26px;overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid rgba(150,140,255,.14)}
th{background:rgba(91,63,216,.35);color:#fff;font-weight:800;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.c{white-space:nowrap} td .y{color:var(--ok);font-weight:700} td .r{color:var(--gold2);font-weight:700}
.legend{margin:12px 2px 0;color:var(--muted);font-size:14px}
.kbd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:14px}
.kbd-grid div{display:flex;justify-content:space-between;gap:10px;background:rgba(22,26,80,.5);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
/* links */
.links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.links-grid a.card{display:block;color:var(--text);text-decoration:none}
.links-grid .ico{font-size:28px;filter:drop-shadow(0 0 10px rgba(255,201,60,.5))}
.links-grid h3{font-size:18px}
.links-grid p{margin:0;font-size:14px;word-break:break-all}
footer{border-top:1px solid var(--line);padding:30px 20px 40px;text-align:center;color:var(--muted);font-size:14px}
footer img{width:46px;margin:0 auto 10px;filter:drop-shadow(0 0 12px rgba(139,92,255,.6))}
.totop{position:fixed;right:18px;bottom:18px;z-index:40;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border:none;box-shadow:0 8px 24px rgba(139,92,255,.5);opacity:0;pointer-events:none;transition:opacity .3s;cursor:pointer;font-size:20px}
.totop.show{opacity:1;pointer-events:auto}
/* decorative character */
.hero-art .deco-char{position:absolute;z-index:2;width:min(400px,30vw);right:-26%;bottom:-16%;pointer-events:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(255,122,182,.35));animation:float 9s ease-in-out infinite reverse}
.hero-art img.folder{z-index:1;transform:translateX(-8%)}
/* lightbox */
#lb{position:fixed;inset:0;z-index:100;background:rgba(4,6,20,.9);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.open{display:flex}
#lb img{max-width:min(1400px,96vw);max-height:92vh;width:auto;border-radius:12px;box-shadow:0 0 60px rgba(139,92,255,.45)}
/* reveal on scroll */
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
/* responsive */
@media (max-width:960px){
  .hero-in{grid-template-columns:1fr;text-align:center;padding-top:40px}
  .hero-art{min-height:280px;order:-1} .hero-art img.folder{width:min(300px,70vw)}
  .hero-art .deco-char{display:none} .hero-art img.folder{transform:none}
  .ctas{justify-content:center} .tagline{margin-left:auto;margin-right:auto}
  .step{grid-template-columns:1fr;gap:22px} .step:nth-child(even) .txt{order:0}
  .dl-grid,.links-grid{grid-template-columns:1fr 1fr} .note{grid-template-columns:1fr}
  nav.links{display:none}
}
@media (max-width:600px){
  .dl-grid,.links-grid,.shots.two{grid-template-columns:1fr}
  section.block{padding:56px 16px} .bar{padding:8px 14px;gap:10px} .brand{font-size:19px}
  .langsel span{display:none} .btn{padding:12px 18px}
}
/* reduced motion: no animation, everything visible */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
  .hero-bg{transform:none}
}
</style>
</head>

      <select id="lang" aria-label="Language"></select></label>

<main id="top">
  <section class="hero">

    <div class="hero-in">
      <div class="rv">

        <h1 class="title">Dosye</h1>
        <p class="tagline" id="tagline"></p>
        <p class="meaning" data-t="meaning"></p>
        <div class="ctas">
          <a class="btn primary" id="ctaWin" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10.5 4.4v7.1H3zm0 13 7.5 1.1v-7H3zm8.4 1.2L21 21v-8.4h-9.6zm0-15.4v7.2H21V3z"/></svg><span data-t="cta_windows"></span></a>
          <a class="btn gold" id="ctaLinux" href="#download"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-2.2 0-3.6 1.9-3.6 4.6 0 1.4.3 2.3-.6 3.7C6.4 12.4 5 14.4 5 17c0 .6.1 1.2.4 1.7-.7.4-1.4.9-1.4 1.6 0 1.4 2.6 1.7 4.4 1.7 1.2 0 2.4-.5 3.6-.5s2.4.5 3.6.5c1.8 0 4.4-.3 4.4-1.7 0-.7-.7-1.2-1.4-1.6.3-.5.4-1.1.4-1.7 0-2.6-1.4-4.6-2.8-6.7-.9-1.4-.6-2.3-.6-3.7C15.6 3.9 14.2 2 12 2zm-1.6 4.2c.4 0 .7.5.7 1.1s-.3 1.1-.7 1.1-.7-.5-.7-1.1.3-1.1.7-1.1zm3.2 0c.4 0 .7.5.7 1.1s-.3 1.1-.7 1.1-.7-.5-.7-1.1.3-1.1.7-1.1zM12 9.3c.9 0 2 .5 2 .9s-1.1 1-2 1-2-.6-2-1 1.1-.9 2-.9z"/></svg><span data-t="cta_linux"></span></a>
          <a class="btn" id="ctaGit" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 4.8 18.3 5.1 18.3 5.1c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg><span data-t="cta_github"></span></a>
        </div>
        <div class="ver"><span data-t="version"></span> <b class="vnum"></b> · Windows 10/11 · Linux x86_64 · GPL-3.0</div>
      </div>
      <div class="hero-art rv d2"><div class="halo"></div><img class="deco-char" id="decoChar" alt="" aria-hidden="true"><img class="folder" id="heroFolder" alt="Dosye folder icon"></div>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <section class="block" id="download">

lème","emblem.original":"Couleurs d'origine","emblem.gravado":"En relief","emblem.branco":"Silhouette blanche","export.ico":"Exporter l'icône (.ico)","export.png":"Exporter en PNG","export.apply":"Appliquer à un dossier…","export.remove":"Retirer l'icône d'un dossier…","export.repair":"Réparer les icônes de dossiers…","settings.title":"Paramètres","settings.language":"Langue","settings.animations":"Animations néon","settings.reduce":"Réduire les effets (sans halo ni animation)","settings.intensity":"Intensité du thème","settings.export":"Export","settings.export_dir":"Dossier d'export par défaut","settings.png_size":"Taille PNG par défaut","settings.ico_sizes":"Tailles dans le .ico","settings.restore":"Valeurs par défaut","about.desc":"De superbes icônes de dossier personnalisées avec couleurs, dégradés, images de couverture, lumière, ombre et images PNG — exportées en .ico ou .png, pour Windows et Linux.","about.meaning":"« Dosye » signifie « dossier » en créole haïtien. 🇭🇹","about.site":"Site officiel","about.project":"Projet sur GitHub","about.donate":"Faire un don","about.license":"Licence : GPL-3.0","help.title":"Aide","help.shortcuts.title":"Raccourcis clavier","repair.title":"Réparer les icônes de dossiers","act.export_ico":"Exporter l'icône (.ico)","act.export_png":"Exporter en PNG","act.open_preset":"Ouvrir un préréglage","act.save_preset":"Enregistrer le préréglage","act.surprise":"Surprends-moi (design aléatoire)","act.search":"Rechercher une forme","act.settings":"Paramètres","act.help":"Aide","act.quit":"Quitter","_language":"Français"},"help":{"start.title":"Pour commencer","start.body":"1. Choisissez une <b>forme</b> à gauche. 2. Réglez le <b>Fill</b> <span class=\"nat\">(remplissage)</span> et les effets à droite. 3. Cliquez sur <b>Export icon (.ico)</b> <span class=\"nat\">(Exporter l'icône (.ico))</span> ou <b>Apply icon to a folder</b> <span class=\"nat\">(Appliquer à un dossier)</span>. En panne d'idées ? Appuyez sur <b>Surprise me</b> <span class=\"nat\">(Surprends-moi)</span>.","shapes.title":"Formes","shapes.body":"Il y a 51 formes réparties en six catégories. Utilisez les boutons de catégorie ou tapez dans la recherche (accents facultatifs). Les miniatures reprennent toujours vos couleurs actuelles.","fill.title":"Couleur, dégradé et couverture","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Couleur / dégradé)</span> peint le dossier d'une ou deux couleurs (clic droit sur une pastille de la palette pour la deuxième couleur). <b>Image (cover)</b> <span class=\"nat\">(Image (couverture))</span> utilise n'importe quelle photo ou texture : appliquez-la à tout le dossier ou seulement à l'avant, choisissez Remplir, Ajuster ou Mosaïque, puis zoomez, déplacez (glissez dans l'aperçu), teintez et fusionnez avec la couleur.","png.title":"Image PNG : qui sort ou emblème","png.body":"Chargez un PNG (ou déposez-le sur l'aperçu). <b>Coming out</b> <span class=\"nat\">(Qui sort)</span> le place entre l'arrière et l'avant, comme s'il dépassait du dossier. <b>Emblem</b> <span class=\"nat\">(Emblème)</span> l'imprime sur l'avant en couleurs d'origine, en relief ou en silhouette blanche. Glissez-le dans l'aperçu et utilisez la molette pour la taille ; maintenez <b>Maj</b> pour alterner entre le PNG et la couverture.","effects.title":"Lumière, ombre et détails","effects.body":"Réglez l'intensité et la direction de la lumière, le vernis, le halo extérieur, l'ombre portée, l'ombrage intérieur, les papiers, la façade en verre dépoli, le contour et l'onglet miroir (à droite). Tout fonctionne avec toutes les formes.","export.title":"Exporter","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Exporter l'icône (.ico))</span> écrit un seul fichier contenant plusieurs tailles (de 16 à 256 px — à choisir dans les Paramètres). <b>Export PNG</b> <span class=\"nat\">(Exporter en PNG)</span> enregistre des images de 256, 512 ou 1024 px avec transparence.","folder.title":"Appliquer l'icône à un dossier","folder.body":"Dosye écrit l'icône <b>dans le dossier</b> dans tous les formats à la fois : un .ico caché avec un desktop.ini (Windows), un PNG caché avec un fichier .directory (KDE Dolphin, PCManFM-Qt) et, sous Linux, le réglage GIO utilisé par GNOME Fichiers, Nemo, Caja et Thunar. Le même dossier affiche donc son icône sous Windows et sous Linux, même sur une clé USB. Appuyez sur F5 si l'Explorateur ne se rafraîchit pas. <b>Remove icon from a folder</b> <span class=\"nat\">(Retirer l'icône d'un dossier)</span> efface le tout.","repair.title":"Icône perdue après une copie ? Réparez-la","repair.body":"Windows n'affiche l'icône d'un dossier que si celui-ci porte un attribut spécial, et une copie avec l'Explorateur, un zip, la synchronisation cloud ou une copie depuis Linux peut le perdre. GNOME Fichiers, Nemo, Caja et Thunar gardent le réglage de l'icône sur chaque ordinateur : il ne voyage pas non plus. Les fichiers de l'icône, eux, voyagent avec le dossier : cliquez sur <b>Repair folder icons</b> <span class=\"nat\">(Réparer les icônes de dossiers…)</span>, choisissez un dossier ou un disque entier, et Dosye restaure toutes les icônes qu'il y a créées, dans tous les sous-dossiers. KDE Dolphin et PCManFM-Qt n'ont besoin d'aucune réparation. Astuce : sous Windows, <code>xcopy /E /H /K</code> conserve l'attribut.","presets.title":"Préréglages","presets.body":"<b>Save</b> <span class=\"nat\">(Enregistrer)</span> sauvegarde votre design dans un fichier .dosye.json avec les images intégrées : il fonctionne sur n'importe quel ordinateur. <b>Open</b> <span class=\"nat\">(Ouvrir)</span> lit aussi les préréglages de Gerador de Pastas (.pasta.json). Vous pouvez aussi déposer un préréglage sur l'aperçu."},"page":{"nav_download":"Télécharger","nav_tutorial":"Tutoriel","nav_links":"Liens","lang_label":"Langue","kicker":"Gratuit et open source · Windows et Linux","cta_windows":"Télécharger pour Windows","cta_linux":"Télécharger pour Linux","cta_github":"Voir sur GitHub","version":"Version","dl_title":"Télécharger","dl_sub":"Portable — rien à installer. Choisissez votre système :","dl_exe":"Windows 10/11 · 64 bits · un seul fichier portable : double-cliquez pour lancer.","dl_appimage":"Linux x86_64 · rendez-le exécutable, puis lancez-le.","dl_targz":"Linux x86_64 · extrayez et lancez ./dosye — ou ./install.sh pour l'ajouter au menu (sans root).","dl_all":"Toutes les versions","smart_title":"SmartScreen de Windows","smart_body":"L'exécutable n'est pas encore signé, Windows peut donc afficher « Windows a protégé votre ordinateur ». Cliquez sur {more} puis sur {run}.","linux_cmd":"Sous Linux :","tut_title":"Tutoriel","tut_sub":"Tout ce que fait Dosye, pas à pas.","where":"Où","controls":"Commandes","s_first":"Téléchargement et premier lancement","first_text":"Ouvrez Dosye : les formes sont à gauche, l'aperçu en direct au centre (avec les vraies tailles de l'icône en dessous) et le panneau de design à droite. Chaque modification s'affiche aussitôt.","s_colors":"Couleurs et dégradés","colors_text":"Dans {fill}, choisissez {color}. Prenez la couleur principale, activez le dégradé pour ajouter une seconde couleur et réglez son angle. Cliquez sur une pastille de la palette pour la couleur principale — clic droit pour la seconde.","settings_text":"Ouvrez {settings} avec le bouton engrenage de l'en-tête. Vos choix sont enregistrés par utilisateur.","st_lang":"choisissez l'une des 15 langues — toute l'interface change immédiatement.","st_anim":"étoiles scintillantes, halos qui respirent et transitions douces ; désactivables à tout moment.","st_reduce":"interface plate et statique pour les PC lents ou le bureau à distance.","st_intensity":"la force du thème néon.","st_export":"dossier d'export par défaut, taille PNG par défaut et tailles incluses dans le .ico.","about_text":"{help} explique chaque fonction et liste les raccourcis clavier. {about} affiche la version, la licence et les liens vers le site, le projet et les dons.","tbl_title":"Ce qui voyage avec le dossier","tbl_situation":"Situation","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Fichiers / Nemo / Caja / Thunar","r1":"Icône appliquée par Dosye directement sur la clé USB (depuis Windows ou Linux), ouverte sur un autre PC","r2":"Dossier copié Windows → clé USB → Windows avec l'Explorateur","r3":"Dossier copié avec xcopy /E /H /K (garde les attributs)","r4":"Dossier copié d'un disque Linux (ext4/btrfs) vers Windows","r5":"Windows → Linux","r6":"zip, OneDrive / Google Drive / Dropbox","c_auto":"automatique","c_repair":"Réparer","c_once":"Réparer une fois par PC","c_maybe":"automatique si l'attribut a survécu, sinon Réparer","c_hidden":"automatique si les fichiers cachés sont conservés","legend":"✅ fonctionne tout seul · 🔧 un clic sur {repair}","links_title":"Liens","l_site":"Site officiel","l_repo":"Code source sur GitHub","l_releases":"Versions et nouveautés","l_donate":"Soutenir le projet","footer":"Dosye est un logiciel libre sous licence GPL-3.0. Fait avec ♥ par cleitinhodev.","top":"Haut de page","shot_hint":"Cliquez pour agrandir","meaning":"« Dosye » veut dire « dossier » en créole haïtien."},"win":["Informations complémentaires","Exécuter quand même"]},"gcf":{"ui":{"app.tagline":"Bèl ikòn dosyé pèsonalizé — limiè, lonbraj, imaj é ékspòtasyon .ico","shapes.title":"Fòm","shapes.search":"Chèché on fòm…","hdr.surprise":"Sipwann mwen","hdr.open":"Ouvè","hdr.save":"Sové","hdr.reset":"Woumèt","hdr.settings":"Réglaj","hdr.help":"Èd","hdr.about":"Asou Dosye","hdr.donate":"Fè on don","cat.all":"Tout","cat.classic":"Klasik","cat.modern":"Modèn","cat.retro":"Rétro","cat.office":"Biwo","cat.fun":"Pou jwé","cat.special":"Èspésyal","preview.title":"Apèsi","fill.title":"Ranplisaj","fill.color":"Koulè / dégradé","fill.image":"Imaj (kouvèti)","cover.choose":"Chwazi on imaj…","cover.examples":"Ègzanp kouvèti:","cover.apply_to":"Mèt asi","cover.area_all":"Tout dosyé-a","cover.area_front":"Douvan sèlman","fit.cobrir":"Kouvè","fit.ajustar":"Ajisté","fit.lado":"Mozayik","cover.zoom":"Zoum","cover.tint":"Kolowé épi koulè-a","cover.blend":"Mélanj koulè","cover.back_dark":"Fè dèyè-a pli fonsé","color.main":"Koulè prensipal","color.gradient":"Sèvi épi dégradé","color.second":"Dézyèm koulè","color.angle":"Ang dégradé-a","color.palette":"Palèt rapid (klik dwèt = 2èm koulè)","light.title":"Limiè é kléwté","light.intensity":"Fòs limiè-a","light.dir":"Dirèksyon limiè-a","light.gloss":"Fini briyan","light.glow":"Lowa dèwò","shadow.title":"Lonbraj","shadow.drop":"Lonbraj pwojété","shadow.inner":"Lonbraj andidan","details.title":"Détay","details.papers":"Papyé andidan dosyé-a","details.mirror":"Lang asi bò dwèt (miwa)","details.glass":"Douvan an vè mat","details.border":"Kontou","png.title":"Imaj PNG","png.none":"San imaj","png.inside":"Ka sòti","png.front":"Anblèm","png.load":"Chajé PNG…","png.scale":"Gwosè","png.rot":"Wotasyon","png.shadow":"Lonbraj imaj-la","png.emblem_style":"Stil anblèm-la","emblem.original":"Koulè orijinal","emblem.gravado":"An rélyèf","emblem.branco":"Silwèt blan","export.ico":"Ékspòté ikòn (.ico)","export.png":"Ékspòté PNG","export.apply":"Mèt ikòn-la asi on dosyé…","export.remove":"Tiré ikòn asi on dosyé…","export.repair":"Réparé ikòn a dosyé…","settings.title":"Réglaj","settings.language":"Lang","settings.animations":"Animasyon néyon","settings.reduce":"Diminyé éfè (san lowa, san animasyon)","settings.intensity":"Fòs tèm-la","settings.export":"Ékspòtasyon","settings.export_dir":"Dosyé ékspòtasyon pa défo","settings.png_size":"Gwosè PNG pa défo","settings.ico_sizes":"Gwosè andidan .ico-a","settings.restore":"Woumèt réglaj dabò","about.desc":"Bèl ikòn dosyé pèsonalizé épi koulè, dégradé, imaj kouvèti, limiè, lonbraj é imaj PNG — ékspòté an .ico oben .png, pou Windows é Linux.","about.meaning":"“Dosye” vlé di “dosyé” an kréyòl ayisyen. 🇭🇹","about.site":"Sit ofisyèl","about.project":"Pwojè-a asi GitHub","about.donate":"Fè on don","about.license":"Lisans: GPL-3.0","help.title":"Èd","help.shortcuts.title":"Rakousi klavyé","repair.title":"Réparé ikòn a dosyé","act.export_ico":"Ékspòté ikòn (.ico)","act.export_png":"Ékspòté PNG","act.open_preset":"Ouvè modèl","act.save_preset":"Sové modèl","act.surprise":"Sipwann mwen (désen o aza)","act.search":"Chèché fòm","act.settings":"Réglaj","act.help":"Èd","act.quit":"Kité","_language":"Kréyòl Gwadloup / Matnik"},"help":{"start.title":"Pou koumansé","start.body":"1. Chwazi on <b>Shapes</b> <span class=\"nat\">(fòm)</span> agòch. 2. Réglé <b>Fill</b> <span class=\"nat\">(ranplisaj)</span>-la é sé éfè-la adwèt. 3. Kliké asi <b>Export icon (.ico)</b> <span class=\"nat\">(Ékspòté ikòn (.ico))</span> oben <b>Apply icon to a folder</b> <span class=\"nat\">(Mèt ikòn-la asi on dosyé)</span>. Pa ni lidé? Apiyé asi <b>Surprise me</b> <span class=\"nat\">(Sipwann mwen)</span>.","shapes.title":"Sé fòm-la","shapes.body":"Ni 51 fòm an sis katégori. Sèvi épi sé bouton katégori-la oben tapé an bwèt rèchèch-la (aksan pa obligatwa). Sé ti imaj-la toujou ka sèvi épi koulè aw a prézan.","fill.title":"Koulè, dégradé é kouvèti","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Koulè / dégradé)</span> ka penn dosyé-a épi yonn oben dé koulè (klik dwèt asi on koulè an palèt-la pou dézyèm koulè-a). <b>Image (cover)</b> <span class=\"nat\">(Imaj (kouvèti))</span> ka sèvi épi nenpòt ki foto oben tèkstir: mèt-li asi tout dosyé-a oben asi douvan-a sèlman, chwazi Kouvè, Ajisté oben Mozayik, é apré zoumé, déplasé (trennen an apèsi-a), kolowé é mélanjé-y épi koulè-a.","png.title":"Imaj PNG: ka sòti oben anblèm","png.body":"Chajé on PNG (oben lagé-y asi apèsi-a). <b>Coming out</b> <span class=\"nat\">(Ka sòti)</span> ka mèt-li ant dèyè é douvan, kon si i té ka gadé déwò dosyé-a. <b>Emblem</b> <span class=\"nat\">(Anblèm)</span> ka enprimé-y asi douvan-a épi koulè orijinal, an rélyèf oben kon silwèt blan. Trennen-y an apèsi-a é sèvi épi woulèt souri-a pou gwosè-a; tchenbé <b>Shift</b> pou chanjé ant PNG-la é kouvèti-a.","effects.title":"Limiè, lonbraj é détay","effects.body":"Réglé fòs é dirèksyon limiè-a, fini briyan, lowa dèwò, lonbraj pwojété, lonbraj andidan, papyé andidan, douvan an vè mat, kontou é lang asi bò dwèt (miwa). Tout bagay ka maché épi tout sé fòm-la.","export.title":"Ékspòté","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Ékspòté ikòn (.ico))</span> ka ékri on sèl fichyé épi plizyè gwosè (16 jis 256 px — chwazi yo an Réglaj). <b>Export PNG</b> <span class=\"nat\">(Ékspòté PNG)</span> ka sové imaj 256, 512 oben 1024 px épi transparans.","folder.title":"Mèt ikòn-la asi on dosyé","folder.body":"Dosye ka ékri ikòn-la <b>andidan dosyé-a</b> an tout fòma-a an menm tan: on .ico kaché épi on desktop.ini (Windows), on PNG kaché épi on fichyé .directory (KDE Dolphin, PCManFM-Qt) é, asi Linux, réglaj GIO a GNOME Files, Nemo, Caja é Thunar. Kon sa, menm dosyé-la ka montré ikòn a-y asi Windows é asi Linux, menm asi on kle USB. Apiyé asi F5 si Èksploratè-a pa rafrèchi. <b>Remove icon from a folder</b> <span class=\"nat\">(Tiré ikòn asi on dosyé)</span> ka éfasé tout sa.","repair.title":"Ikòn-la disparèt aprè ou kopyé? Réparé-y","repair.body":"Windows ka montré ikòn a on dosyé sèlman lè dosyé-la ni on mak èspésyal, é kopyé épi Èksploratè-a, fichyé zip, sinkwonizasyon an nwaj oben kopyé sòti an Linux pé fè mak-lasa pèd. GNOME Files, Nemo, Caja é Thunar ka kenbé réglaj a ikòn-la asi chak òwdinatè, alò i pa ka vwayajé non pli. Men fichyé a ikòn-la ka vwayajé épi dosyé-a: kliké asi <b>Repair folder icons</b> <span class=\"nat\">(Réparé ikòn a dosyé…)</span>, chwazi on dosyé oben tout on disk, é Dosye ké woumèt tout ikòn i té fè la é an tout sou-dosyé-la. KDE Dolphin é PCManFM-Qt pa bizwen réparasyon. Konsèy: asi Windows, <code>xcopy /E /H /K</code> ka kenbé mak-la.","presets.title":"Modèl","presets.body":"<b>Save</b> <span class=\"nat\">(Sové)</span> ka anrèjistré désen aw an on fichyé .dosye.json épi sé imaj-la andidan, kifè i ka maché asi nenpòt ki òwdinatè. <b>Open</b> <span class=\"nat\">(Ouvè)</span> ka li modèl Gerador de Pastas osi (.pasta.json). Ou pé lagé on modèl asi apèsi-a osi."},"page":{"nav_download":"Téléchajé","nav_tutorial":"Lèson","nav_links":"Lyen","lang_label":"Lang","kicker":"Gratis é sous ouvè · Windows é Linux","cta_windows":"Téléchajé pou Windows","cta_linux":"Téléchajé pou Linux","cta_github":"Gadé asi GitHub","version":"Vèsyon","dl_title":"Téléchajé","dl_sub":"Pòtab — pa ni ayen pou enstalé. Chwazi sistèm a-w:","dl_exe":"Windows 10/11 · 64 bit · on sèl fichyé pòtab: kliké dé fwa pou lansé-y.","dl_appimage":"Linux x86_64 · fè-y égzékitab, é lansé-y.","dl_targz":"Linux x86_64 · dékonprésé é lansé ./dosye — oben ./install.sh pou mèt-li an menu-a (san root).","dl_all":"Tout vèsyon-la","smart_title":"Windows SmartScreen","smart_body":"Fichyé-la poko ni siyati dijital, alò Windows pé montré “Windows a protégé votre ordinateur”. Kliké asi {more} é asi {run}.","linux_cmd":"Asi Linux:","tut_title":"Lèson","tut_sub":"Tout sa Dosye pé fè, étap pa étap.","where":"Kotésa","controls":"Kontwòl","s_first":"Téléchajé é prèmyé lansman","first_text":"Ouvè Dosye: fòm-la asi bò gòch, apèsi-la an dirèk an mitan (épi vré gwosè a ikòn-la anba-y) é pano désen-la asi bò dwèt. Chak chanjman ka parèt tousuit.","s_colors":"Koulè é dégradé","colors_text":"An {fill}, chwazi {color}. Chwazi koulè prensipal-la, aktivé dégradé-la pou ajouté on dézyèm koulè é réglé ang-la. Kliké asi on koulè an palèt-la pou koulè prensipal-la — kliké adwèt pou dézyèm-la.","settings_text":"Ouvè {settings} épi bouton angrenaj-la anlè. Chwa a-w ka sové pou chak itilizatè.","st_lang":"chwazi nenpòt lang an 15-la — tout entèfas-la ka chanjé tousuit.","st_anim":"zétwal ki ka kléré, limyè ki ka respiré é tranzisyon dous; ou pé étenn-yo nenpòt lè.","st_reduce":"on entèfas pla é fiks pou PC ki lan oben biwo a distans.","st_intensity":"fòs a tèm néyon-la.","st_export":"dosyé èkspòtasyon pa défo, gwosè PNG pa défo é gwosè ki ka antré an .ico-la.","about_text":"{help} ka èsplitjé chak fonksyon é ka bay rakousi klavyé-la. {about} ka montré vèsyon-la, lisans-la é lyen a sit-la, pwojè-la é don.","tbl_title":"Sa ki ka vwayajé épi dosyé-la","tbl_situation":"Sitiyasyon","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Files / Nemo / Caja / Thunar","r1":"Dosye mèt ikòn-la dirèk asi kle USB-la (dépi Windows oben Linux), é yo ouvè-y asi on dòt PC","r2":"Dosyé kopyé Windows → kle USB → Windows épi Èksploratè-a","r3":"Dosyé kopyé épi xcopy /E /H /K (ka kenbé atribi-la)","r4":"Dosyé kopyé sòti an on disk Linux (ext4/btrfs) pou Windows","r5":"Windows → Linux","r6":"fichyé zip, OneDrive / Google Drive / Dropbox","c_auto":"otomatik","c_repair":"Réparé","c_once":"Réparé on fwa pou chak PC","c_maybe":"otomatik si atribi-la rété, sinon Réparé","c_hidden":"otomatik si fichyé kaché-la rété","legend":"✅ ka maché tousèl · 🔧 on klik asi {repair}","links_title":"Lyen","l_site":"Sit ofisyèl","l_repo":"Kòd sous asi GitHub","l_releases":"Vèsyon é nouvoté","l_donate":"Sipòté pwojè-la","footer":"Dosye sé on lojisyèl lib anba lisans GPL-3.0. Fèt épi ♥ pa cleitinhodev.","top":"Rimonté anlè","shot_hint":"Kliké pou agrandi","meaning":"“Dosye” vé di “dosyé” an kréyòl ayisyen."},"win":["Informations complémentaires","Exécuter quand même"]},"mfe":{"ui":{"app.tagline":"Zoli ikon dosie personalize — limier, lombraz, imaz ek export .ico","shapes.title":"Form","shapes.search":"Rod enn form…","hdr.surprise":"Sirpran mwa","hdr.open":"Ouver","hdr.save":"Sov","hdr.reset":"Rekomanse","hdr.settings":"Paramet","hdr.help":"Led","hdr.about":"Lor Dosye","hdr.donate":"Fer enn don","cat.all":"Tou","cat.classic":"Klasik","cat.modern":"Modern","cat.retro":"Retro","cat.office":"Biro","cat.fun":"Amizan","cat.special":"Spesial","preview.title":"Aperso","fill.title":"Ranplisaz","fill.color":"Kouler / degrade","fill.image":"Imaz (kouvertir)","cover.choose":"Swazir enn imaz…","cover.examples":"Lexanp kouvertir:","cover.apply_to":"Met lor","cover.area_all":"Tou dosie","cover.area_front":"Devan selman","fit.cobrir":"Kouver","fit.ajustar":"Aziste","fit.lado":"Mozaik","cover.zoom":"Zoum","cover.tint":"Kolor ar kouler","cover.blend":"Melanz kouler","cover.back_dark":"Fer deryer-la pli fonse","color.main":"Kouler prinsipal","color.gradient":"Servi degrade","color.second":"Dezyem kouler","color.angle":"Lang degrade","color.palette":"Palet rapid (klik drwat = 2yem kouler)","light.title":"Limier ek briyans","light.intensity":"Lafors limier","light.dir":"Direksion limier","light.gloss":"Fini briyan","light.glow":"Lorer deor","shadow.title":"Lombraz","shadow.drop":"Lombraz proze","shadow.inner":"Lombraz andan","details.title":"Detay","details.papers":"Papie andan dosie","details.mirror":"Lang lor kote drwat (mirwar)","details.glass":"Devan an ver mat","details.border":"Kontour","png.title":"Imaz PNG","png.none":"San imaz","png.inside":"Pe sorti","png.front":"Anblem","png.load":"Sarz PNG…","png.scale":"Grander","png.rot":"Rotasion","png.shadow":"Lombraz imaz","png.emblem_style":"Stil anblem","emblem.original":"Kouler orizinal","emblem.gravado":"An relief","emblem.branco":"Silwet blan","export.ico":"Export ikon (.ico)","export.png":"Export PNG","export.apply":"Met ikon lor enn dosie…","export.remove":"Tir ikon lor enn dosie…","export.repair":"Repar ikon bann dosie…","settings.title":"Paramet","settings.language":"Lang","settings.animations":"Animasion neon","settings.reduce":"Diminye bann efe (san lorer, san animasion)","settings.intensity":"Lafors tem","settings.export":"Export","settings.export_dir":"Dosie export par defo","settings.png_size":"Grander PNG par defo","settings.ico_sizes":"Grander andan .ico","settings.restore":"Remet paramet par defo","about.desc":"Zoli ikon dosie personalize ar kouler, degrade, imaz kouvertir, limier, lombraz ek imaz PNG — exporte an .ico ouswa .png, pou Windows ek Linux.","about.meaning":"“Dosye” vedir “dosie” an kreol ayisien. 🇭🇹","about.site":"Sit ofisiel","about.project":"Proze lor GitHub","about.donate":"Fer enn don","about.license":"Lisans: GPL-3.0","help.title":"Led","help.shortcuts.title":"Rakoursi klavie","repair.title":"Repar ikon bann dosie","act.export_ico":"Export ikon (.ico)","act.export_png":"Export PNG","act.open_preset":"Ouver model","act.save_preset":"Sov model","act.surprise":"Sirpran mwa (desin o-azar)","act.search":"Rod form","act.settings":"Paramet","act.help":"Led","act.quit":"Sorti","_language":"Kreol Morisien"},"help":{"start.title":"Pou koumanse","start.body":"1. Swazir enn <b>Shapes</b> <span class=\"nat\">(form)</span> lor gos. 2. Ranz <b>Fill</b> <span class=\"nat\">(ranplisaz)</span> ek bann efe lor drwat. 3. Klik lor <b>Export icon (.ico)</b> <span class=\"nat\">(Export ikon (.ico))</span> ouswa <b>Apply icon to a folder</b> <span class=\"nat\">(Met ikon lor enn dosie)</span>. Pena lide? Pes <b>Surprise me</b> <span class=\"nat\">(Sirpran mwa)</span>.","shapes.title":"Bann form","shapes.body":"Ena 51 form dan sis kategori. Servi bann bouton kategori ouswa tap dan lakaz rod (aksan pa obligatwar). Bann ti imaz touletan servi ou bann kouler aktiel.","fill.title":"Kouler, degrade ek kouvertir","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Kouler / degrade)</span> pent dosie ar enn ouswa de kouler (klik drwat lor enn kouler dan palet pou dezyem kouler). <b>Image (cover)</b> <span class=\"nat\">(Imaz (kouvertir))</span> servi nenport ki foto ouswa textir: met li lor tou dosie ouswa lor devan selman, swazir Kouver, Aziste ouswa Mozaik, apre zoum, deplase (trenn dan aperso), kolor ek melanz li ar kouler.","png.title":"Imaz PNG: pe sorti ouswa anblem","png.body":"Sarz enn PNG (ouswa larg li lor aperso). <b>Coming out</b> <span class=\"nat\">(Pe sorti)</span> met li ant deryer ek devan, kouma si li pe get deor dosie. <b>Emblem</b> <span class=\"nat\">(Anblem)</span> inprim li lor devan ar so kouler orizinal, an relief ouswa kouma silwet blan. Trenn li dan aperso ek servi roulet lasouri pou grander; tini <b>Shift</b> pou sanze ant PNG ek kouvertir.","effects.title":"Limier, lombraz ek detay","effects.body":"Ranz lafors ek direksion limier, fini briyan, lorer deor, lombraz proze, lombraz andan, papie andan, devan an ver mat, kontour ek lang lor kote drwat (mirwar). Tou marse ar tou bann form.","export.title":"Export","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Export ikon (.ico))</span> ekrir enn sel fisie ar plizir grander (16 ziska 256 px — swazir zot dan Paramet). <b>Export PNG</b> sov imaz 256, 512 ouswa 1024 px ar transparans.","folder.title":"Met ikon lor enn dosie","folder.body":"Dosye ekrir ikon-la <b>andan dosie</b> dan tou bann format an mem tan: enn .ico kase ar enn desktop.ini (Windows), enn PNG kase ar enn fisie .directory (KDE Dolphin, PCManFM-Qt) ek, lor Linux, reglaz GIO ki GNOME Files, Nemo, Caja ek Thunar servi. Koumsa mem dosie-la montre so ikon lor Windows ek lor Linux, mem lor enn kle USB. Pes F5 si Explorater pa rafresi. <b>Remove icon from a folder</b> <span class=\"nat\">(Tir ikon lor enn dosie)</span> efas tou sa.","repair.title":"Ikon-la finn disparet apre enn kopi? Repar li","repair.body":"Windows montre ikon enn dosie zis kan dosie-la ena enn mark spesial, ek kopie ar Explorater, fisie zip, sinkronizasion dan nyaz ouswa kopie depi Linux kapav fer sa mark-la perdi. GNOME Files, Nemo, Caja ek Thunar gard reglaz ikon lor sak lordinater, alor li pa vwayaz nonplis. Me bann fisie ikon vwayaz ar dosie-la: klik lor <b>Repair folder icons</b> <span class=\"nat\">(Repar ikon bann dosie…)</span>, swazir enn dosie ouswa enn disk antie, ek Dosye pou remet tou bann ikon ki li ti kree laba ek dan tou bann sou-dosie. KDE Dolphin ek PCManFM-Qt pa bizin reparasion. Konsey: lor Windows, <code>xcopy /E /H /K</code> gard mark-la.","presets.title":"Model","presets.body":"<b>Save</b> <span class=\"nat\">(Sov)</span> anrezistre ou desin dan enn fisie .dosye.json ar bann imaz andan, alor li marse lor nenport ki lordinater. <b>Open</b> <span class=\"nat\">(Ouver)</span> osi lir model Gerador de Pastas (.pasta.json). Ou kapav osi larg enn model lor aperso."},"page":{"nav_download":"Telesarz","nav_tutorial":"Leson","nav_links":"Lien","lang_label":"Lang","kicker":"Gratis ek sours ouver · Windows ek Linux","cta_windows":"Telesarz pou Windows","cta_linux":"Telesarz pou Linux","cta_github":"Get lor GitHub","version":"Version","dl_title":"Telesarz","dl_sub":"Portab — narien pou instale. Swazir to sistem:","dl_exe":"Windows 10/11 · 64 bit · enn sel fisie portab: klik de fwa pou lans li.","dl_appimage":"Linux x86_64 · rann li egzekitab, apre lans li.","dl_targz":"Linux x86_64 · dekonprese ek lans ./dosye — ouswa ./install.sh pou met li dan meni (san root).","dl_all":"Tou bann version","smart_title":"Windows SmartScreen","smart_body":"Fisie-la pa ankor ena sinyatir dizital, alor Windows kapav montre “Windows protected your PC”. Klik lor {more} ek apre lor {run}.","linux_cmd":"Lor Linux:","tut_title":"Leson","tut_sub":"Tou seki Dosye kapav fer, etap par etap.","where":"Kot","controls":"Kontrol","s_first":"Telesarz ek premie lansman","first_text":"Ouver Dosye: bann form lor kote gos, laperson an direk dan milie (ar vre gro ikon anba) ek panel dezin lor kote drwat. Sak sanzman paret tousuit.","s_colors":"Kouler ek degrade","colors_text":"Dan {fill}, swazir {color}. Swazir kouler prinsipal, aktiv degrade pou azout enn dezyem kouler ek ranz so lang. Klik lor enn kouler dan palet pou kouler prinsipal — klik drwat pou dezyem.","settings_text":"Ouver {settings} ar bouton angrenaz anler. To bann swa sov pou sak itilizater.","st_lang":"swazir ninport ki lang parmi 15 — tou lentersas sanze tousuit.","st_anim":"zetwal ki briye, lalimier ki respire ek tranzision dou; to kapav tej zot ninport kan.","st_reduce":"enn lentersas pla ek fix pou PC ki lant ouswa biro a distans.","st_intensity":"lafors tem neon.","st_export":"dosie export par defo, gro PNG par defo ek bann gro ki rant dan .ico.","about_text":"{help} explik sak fonksion ek donn rakousi klavie. {about} montre version, lisans ek bann lien sit, proze ek don.","tbl_title":"Seki vwayaz ar dosie","tbl_situation":"Sitiasion","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Files / Nemo / Caja / Thunar","r1":"Dosye met ikon direk lor kle USB (depi Windows ouswa Linux), ek ouver li lor enn lot PC","r2":"Dosie kopie Windows → kle USB → Windows ar Explorater","r3":"Dosie kopie ar xcopy /E /H /K (gard bann atribi)","r4":"Dosie kopie depi enn disk Linux (ext4/btrfs) ver Windows","r5":"Windows → Linux","r6":"fisie zip, OneDrive / Google Drive / Dropbox","c_auto":"otomatik","c_repair":"Repar","c_once":"Repar enn fwa pou sak PC","c_maybe":"otomatik si atribi-la reste, sinon Repar","c_hidden":"otomatik si fisie kase reste","legend":"✅ marse tousel · 🔧 enn klik lor {repair}","links_title":"Lien","l_site":"Sit ofisiel","l_repo":"Kod sours lor GitHub","l_releases":"Version ek nouvote","l_donate":"Siport proze-la","footer":"Dosye se enn lozisiel lib anba lisans GPL-3.0. Fer ar ♥ par cleitinhodev.","top":"Retourn anler","shot_hint":"Klik pou agrandi","meaning":"“Dosye” vedir “dosie” an kreol ayisien."},"win":["More info","Run anyway"]},"en":{"ui":{"app.tagline":"Beautiful custom folder icons — light, shadow, images and .ico export","shapes.title":"Shapes","shapes.search":"Search shapes…","hdr.surprise":"Surprise me","hdr.open":"Open","hdr.save":"Save","hdr.reset":"Reset","hdr.settings":"Settings","hdr.help":"Help","hdr.about":"About Dosye","hdr.donate":"Donate","cat.all":"All","cat.classic":"Classic","cat.modern":"Modern","cat.retro":"Retro","cat.office":"Office","cat.fun":"Fun","cat.special":"Special","preview.title":"Preview","fill.title":"Fill","fill.color":"Colour / gradient","fill.image":"Image (cover)","cover.choose":"Choose image…","cover.examples":"Sample covers:","cover.apply_to":"Apply to","cover.area_all":"Whole folder","cover.area_front":"Front only","fit.cobrir":"Fill","fit.ajustar":"Fit","fit.lado":"Tile","cover.zoom":"Zoom","cover.tint":"Tint with colour","cover.blend":"Colour blend","cover.back_dark":"Darken the back","color.main":"Main colour","color.gradient":"Use gradient","color.second":"Second colour","color.angle":"Gradient angle","color.palette":"Quick palette (right-click = 2nd colour)","light.title":"Light & gloss","light.intensity":"Light intensity","light.dir":"Light direction","light.gloss":"Glossy finish","light.glow":"Outer glow","shadow.title":"Shadow","shadow.drop":"Drop shadow","shadow.inner":"Inner shading","details.title":"Details","details.papers":"Papers inside the folder","details.mirror":"Tab on the right (mirror)","details.glass":"Frosted glass front","details.border":"Outline","png.title":"PNG image","png.none":"Plain","png.inside":"Coming out","png.front":"Emblem","png.load":"Load PNG…","png.scale":"Size","png.rot":"Rotation","png.shadow":"Image shadow","png.emblem_style":"Emblem style","emblem.original":"Original colours","emblem.gravado":"Embossed","emblem.branco":"White silhouette","export.ico":"Export icon (.ico)","export.png":"Export PNG","export.apply":"Apply icon to a folder…","export.remove":"Remove icon from a folder…","export.repair":"Repair folder icons…","settings.title":"Settings","settings.language":"Language","settings.animations":"Neon animations","settings.reduce":"Reduce effects (no glow, no animation)","settings.intensity":"Theme intensity","settings.export":"Export","settings.export_dir":"Default export folder","settings.png_size":"Default PNG size","settings.ico_sizes":"Sizes inside the .ico","settings.restore":"Restore defaults","about.desc":"Beautiful custom folder icons with colours, gradients, image covers, light, shadow and PNG images — exported as .ico or .png, for Windows and Linux.","about.meaning":"“Dosye” means “folder” in Haitian Creole. 🇭🇹","about.site":"Official website","about.project":"Project on GitHub","about.donate":"Donate","about.license":"License: GPL-3.0","help.title":"Help","help.shortcuts.title":"Keyboard shortcuts","repair.title":"Repair folder icons","act.export_ico":"Export icon (.ico)","act.export_png":"Export PNG","act.open_preset":"Open preset","act.save_preset":"Save preset","act.surprise":"Surprise me (random design)","act.search":"Search shapes","act.settings":"Settings","act.help":"Help","act.quit":"Quit","_language":"English"},"help":{"start.title":"Getting started","start.body":"1. Choose a <b>shape</b> on the left. 2. Set the <b>fill</b> and effects on the right. 3. Click <b>Export icon (.ico)</b> or <b>Apply icon to a folder</b>. Not inspired? Press <b>Surprise me</b>.","shapes.title":"Shapes","shapes.body":"There are 51 shapes in six categories. Use the category buttons or type in the search box (accents optional). Thumbnails always use your current colours.","fill.title":"Colour, gradient and cover","fill.body":"<b>Colour / gradient</b> paints the folder with one or two colours (right-click a palette swatch to set the second colour). <b>Image (cover)</b> uses any photo or texture: apply it to the whole folder or only the front, choose Fill, Fit or Tile, then zoom, move (drag in the preview), tint and blend it with the colour.","png.title":"PNG image: coming out or emblem","png.body":"Load a PNG (or drop it on the preview). <b>Coming out</b> places it between the back and the front, as if it were peeking out of the folder. <b>Emblem</b> prints it on the front with original colours, embossed or as a white silhouette. Drag it in the preview and use the mouse wheel to resize; hold <b>Shift</b> to switch between the PNG and the cover.","effects.title":"Light, shadow and details","effects.body":"Adjust light intensity and direction, gloss, outer glow, drop shadow, inner shading, papers inside, frosted glass front, outline and the mirrored (right-side) tab. Everything works with every shape.","export.title":"Export","export.body":"<b>Export icon (.ico)</b> writes one file with several sizes (16 to 256 px — choose them in Settings). <b>Export PNG</b> saves 256, 512 or 1024 px images with transparency.","folder.title":"Apply the icon to a folder","folder.body":"Dosye writes the icon <b>inside the folder</b> in every format at once: a hidden .ico with a desktop.ini (Windows), a hidden PNG with a .directory file (KDE Dolphin, PCManFM-Qt) and, on Linux, the GIO setting used by GNOME Files, Nemo, Caja and Thunar. So the same folder shows its icon on Windows and on Linux, even on a pendrive. Press F5 if Explorer doesn't refresh. <b>Remove icon from a folder</b> deletes all of it.","repair.title":"Icon gone after a copy? Repair it","repair.body":"Windows only shows a folder icon while the folder carries a special flag, and copying with File Explorer, zip files, cloud sync or copying from Linux can drop that flag. GNOME Files, Nemo, Caja and Thunar keep their icon setting on each computer, so it doesn't travel either. The icon files do travel with the folder: click <b>Repair folder icons…</b>, pick a folder or a whole drive, and Dosye restores every icon it made there and in all subfolders. KDE Dolphin and PCManFM-Qt need no repair. Tip: on Windows, <code>xcopy /E /H /K</code> keeps the flag.","presets.title":"Presets","presets.body":"<b>Save</b> stores your design as a .dosye.json file with the images embedded, so it works on any computer. <b>Open</b> also reads presets from Gerador de Pastas (.pasta.json). You can drop a preset on the preview too."},"page":{"nav_download":"Download","nav_tutorial":"Tutorial","nav_links":"Links","lang_label":"Language","kicker":"Free & open source · Windows & Linux","cta_windows":"Download for Windows","cta_linux":"Download for Linux","cta_github":"View on GitHub","version":"Version","dl_title":"Download","dl_sub":"Portable — nothing to install. Pick your system:","dl_exe":"Windows 10/11 · 64-bit · one portable file: double-click to run.","dl_appimage":"Linux x86_64 · make it executable, then run it.","dl_targz":"Linux x86_64 · extract and run ./dosye — or ./install.sh to add a menu entry (no root).","dl_all":"All releases and older versions","smart_title":"Windows SmartScreen","smart_body":"The executable isn't code-signed yet, so Windows may show “Windows protected your PC”. Click {more} and then {run}.","linux_cmd":"On Linux:","tut_title":"Tutorial","tut_sub":"Everything Dosye can do, step by step.","where":"Where","controls":"Controls","s_first":"Download and first run","first_text":"Open Dosye: the window has the shapes on the left, the live preview in the middle (with the real icon sizes below it) and the design panel on the right. Every change shows up instantly.","s_colors":"Colours and gradients","colors_text":"In {fill}, choose {color}. Pick the main colour, turn on the gradient to add a second colour and set its angle. Click a palette swatch for the main colour — right-click it for the second one.","settings_text":"Open {settings} from the gear button in the header. Your choices are saved per user.","st_lang":"choose any of the 15 languages — the whole interface switches immediately.","st_anim":"twinkling stars, breathing glows and smooth transitions; turn them off any time.","st_reduce":"a flat, static interface for slow PCs or remote desktop.","st_intensity":"how strong the neon theme looks.","st_export":"default export folder, default PNG size and which sizes go inside the .ico.","about_text":"{help} explains every feature and lists the keyboard shortcuts. {about} shows the version, the license and links to the website, the project and donations.","tbl_title":"What travels with the folder","tbl_situation":"Situation","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Files / Nemo / Caja / Thunar","r1":"Icon applied by Dosye directly on the pendrive (from Windows or Linux), opened on another PC","r2":"Folder copied Windows → pendrive → Windows with File Explorer","r3":"Folder copied with xcopy /E /H /K (keeps attributes)","r4":"Folder copied from a Linux disk (ext4/btrfs) to Windows","r5":"Windows → Linux","r6":"zip archives, OneDrive / Google Drive / Dropbox","c_auto":"automatic","c_repair":"Repair","c_once":"Repair once per PC","c_maybe":"automatic if the attribute survived, otherwise Repair","c_hidden":"automatic if hidden files are kept","legend":"✅ works automatically · 🔧 one click on {repair}","links_title":"Links","l_site":"Official website","l_repo":"Source code on GitHub","l_releases":"Releases & changelog","l_donate":"Support the project","footer":"Dosye is free software under the GPL-3.0 license. Made with ♥ by cleitinhodev.","top":"Back to top","shot_hint":"Click to enlarge","meaning":"“Dosye” means “folder” in Haitian Creole."},"win":["More info","Run anyway"]},"pt_BR":{"ui":{"app.tagline":"Ícones de pasta lindos e personalizados — luz, sombra, imagens e exportação .ico","shapes.title":"Formatos","shapes.search":"Buscar formato…","hdr.surprise":"Surpreenda-me","hdr.open":"Abrir","hdr.save":"Salvar","hdr.reset":"Restaurar","hdr.settings":"Configurações","hdr.help":"Ajuda","hdr.about":"Sobre o Dosye","hdr.donate":"Doar","cat.all":"Todos","cat.classic":"Clássicas","cat.modern":"Modernas","cat.retro":"Retrô","cat.office":"Escritório","cat.fun":"Divertidas","cat.special":"Especiais","preview.title":"Prévia","fill.title":"Preenchimento","fill.color":"Cor / degradê","fill.image":"Imagem (capa)","cover.choose":"Escolher imagem…","cover.examples":"Capas de exemplo:","cover.apply_to":"Aplicar em","cover.area_all":"Pasta inteira","cover.area_front":"Só a frente","fit.cobrir":"Cobrir","fit.ajustar":"Ajustar","fit.lado":"Lado a lado","cover.zoom":"Zoom","cover.tint":"Tingir com a cor","cover.blend":"Mistura da cor","cover.back_dark":"Escurecer o fundo","color.main":"Cor principal","color.gradient":"Usar degradê","color.second":"Segunda cor","color.angle":"Ângulo do degradê","color.palette":"Paleta rápida (botão direito = 2ª cor)","light.title":"Luz e brilho","light.intensity":"Intensidade da luz","light.dir":"Direção da luz","light.gloss":"Acabamento brilhante","light.glow":"Brilho externo (glow)","shadow.title":"Sombra","shadow.drop":"Sombra projetada","shadow.inner":"Sombreamento interno","details.title":"Detalhes","details.papers":"Papéis dentro da pasta","details.mirror":"Aba do lado direito (espelhar)","details.glass":"Frente de vidro fosco","details.border":"Contorno","png.title":"Imagem PNG","png.none":"Pura","png.inside":"Saindo","png.front":"Emblema","png.load":"Carregar PNG…","png.scale":"Tamanho","png.rot":"Rotação","png.shadow":"Sombra da imagem","png.emblem_style":"Estilo do emblema","emblem.original":"Cores originais","emblem.gravado":"Gravado em relevo","emblem.branco":"Silhueta branca","export.ico":"Exportar ícone (.ico)","export.png":"Exportar PNG","export.apply":"Aplicar ícone em uma pasta…","export.remove":"Remover ícone de uma pasta…","export.repair":"Reparar ícones de pastas…","settings.title":"Configurações","settings.language":"Idioma","settings.animations":"Animações neon","settings.reduce":"Reduzir efeitos (sem brilho, sem animação)","settings.intensity":"Intensidade do tema","settings.export":"Exportação","settings.export_dir":"Pasta padrão de exportação","settings.png_size":"Tamanho padrão do PNG","settings.ico_sizes":"Tamanhos dentro do .ico","settings.restore":"Restaurar padrões","about.desc":"Ícones de pasta lindos e personalizados com cores, degradês, imagens de capa, luz, sombra e imagens PNG — exportados em .ico ou .png, para Windows e Linux.","about.meaning":"“Dosye” significa “pasta” em crioulo haitiano. 🇭🇹","about.site":"Site oficial","about.project":"Projeto no GitHub","about.donate":"Doar","about.license":"Licença: GPL-3.0","help.title":"Ajuda","help.shortcuts.title":"Atalhos de teclado","repair.title":"Reparar ícones de pastas","act.export_ico":"Exportar ícone (.ico)","act.export_png":"Exportar PNG","act.open_preset":"Abrir preset","act.save_preset":"Salvar preset","act.surprise":"Surpreenda-me (design aleatório)","act.search":"Buscar formato","act.settings":"Configurações","act.help":"Ajuda","act.quit":"Sair","_language":"Português (Brasil)"},"help":{"start.title":"Primeiros passos","start.body":"1. Escolha um <b>formato</b> à esquerda. 2. Ajuste o <b>Fill</b> <span class=\"nat\">(preenchimento)</span> e os efeitos à direita. 3. Clique em <b>Export icon (.ico)</b> <span class=\"nat\">(Exportar ícone (.ico))</span> ou <b>Apply icon to a folder</b> <span class=\"nat\">(Aplicar ícone em uma pasta)</span>. Sem ideias? Aperte <b>Surprise me</b> <span class=\"nat\">(Surpreenda-me)</span>.","shapes.title":"Formatos","shapes.body":"São 51 formatos em seis categorias. Use os botões de categoria ou digite na busca (acentos são opcionais). As miniaturas sempre usam as suas cores atuais.","fill.title":"Cor, degradê e capa","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Cor / degradê)</span> pinta a pasta com uma ou duas cores (botão direito numa cor da paleta define a segunda cor). <b>Image (cover)</b> <span class=\"nat\">(Imagem (capa))</span> usa qualquer foto ou textura: aplique na pasta inteira ou só na frente, escolha Cobrir, Ajustar ou Lado a lado e depois dê zoom, mova (arrastando na prévia), tinja e misture com a cor.","png.title":"Imagem PNG: saindo ou emblema","png.body":"Carregue um PNG (ou solte-o na prévia). <b>Coming out</b> <span class=\"nat\">(Saindo)</span> coloca a imagem entre o fundo e a frente, como se estivesse saindo da pasta. <b>Emblem</b> <span class=\"nat\">(Emblema)</span> estampa na frente com as cores originais, em relevo ou como silhueta branca. Arraste na prévia e use a roda do mouse para o tamanho; segure <b>Shift</b> para alternar entre o PNG e a capa.","effects.title":"Luz, sombra e detalhes","effects.body":"Ajuste intensidade e direção da luz, verniz, brilho externo, sombra projetada, sombreamento interno, papéis dentro, frente de vidro fosco, contorno e a aba espelhada (do lado direito). Tudo funciona em todos os formatos.","export.title":"Exportar","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Exportar ícone (.ico))</span> grava um arquivo com vários tamanhos (de 16 a 256 px — escolha nas Configurações). <b>Export PNG</b> <span class=\"nat\">(Exportar PNG)</span> salva imagens de 256, 512 ou 1024 px com transparência.","folder.title":"Aplicar o ícone em uma pasta","folder.body":"O Dosye grava o ícone <b>dentro da pasta</b> em todos os formatos de uma vez: um .ico oculto com um desktop.ini (Windows), um PNG oculto com um arquivo .directory (KDE Dolphin, PCManFM-Qt) e, no Linux, a configuração GIO usada pelo GNOME Arquivos, Nemo, Caja e Thunar. Assim a mesma pasta mostra o ícone no Windows e no Linux, até em um pendrive. Aperte F5 se o Explorador não atualizar. <b>Remove icon from a folder</b> <span class=\"nat\">(Remover ícone de uma pasta)</span> apaga tudo isso.","repair.title":"O ícone sumiu depois de copiar? Repare","repair.body":"O Windows só mostra o ícone de uma pasta enquanto ela tem uma marcação especial, e copiar pelo Explorador, compactar em zip, sincronizar com a nuvem ou copiar a partir do Linux pode perder essa marcação. GNOME Arquivos, Nemo, Caja e Thunar guardam a configuração do ícone em cada computador, então ela também não viaja. Já os arquivos do ícone viajam com a pasta: clique em <b>Repair folder icons</b> <span class=\"nat\">(Reparar ícones de pastas…)</span>, escolha uma pasta ou um disco inteiro e o Dosye restaura todos os ícones que criou ali e em todas as subpastas. KDE Dolphin e PCManFM-Qt não precisam de reparo. Dica: no Windows, <code>xcopy /E /H /K</code> mantém a marcação.","presets.title":"Presets","presets.body":"<b>Save</b> <span class=\"nat\">(Salvar)</span> guarda o seu design num arquivo .dosye.json com as imagens embutidas, então funciona em qualquer computador. <b>Open</b> <span class=\"nat\">(Abrir)</span> também lê presets do Gerador de Pastas (.pasta.json). Você também pode soltar um preset na prévia."},"page":{"nav_download":"Download","nav_tutorial":"Tutorial","nav_links":"Links","lang_label":"Idioma","kicker":"Grátis e de código aberto · Windows e Linux","cta_windows":"Baixar para Windows","cta_linux":"Baixar para Linux","cta_github":"Ver no GitHub","version":"Versão","dl_title":"Download","dl_sub":"Portátil — nada para instalar. Escolha seu sistema:","dl_exe":"Windows 10/11 · 64 bits · um arquivo portátil: dois cliques para abrir.","dl_appimage":"Linux x86_64 · torne executável e rode.","dl_targz":"Linux x86_64 · extraia e rode ./dosye — ou ./install.sh para criar o atalho no menu (sem root).","dl_all":"Todas as releases e versões antigas","smart_title":"SmartScreen do Windows","smart_body":"O executável ainda não tem assinatura digital, então o Windows pode mostrar “O Windows protegeu o computador”. Clique em {more} e depois em {run}.","linux_cmd":"No Linux:","tut_title":"Tutorial","tut_sub":"Tudo o que o Dosye faz, passo a passo.","where":"Onde","controls":"Controles","s_first":"Download e primeira execução","first_text":"Abra o Dosye: à esquerda ficam os formatos, no meio a prévia ao vivo (com os tamanhos reais do ícone embaixo) e à direita o painel de design. Toda mudança aparece na hora.","s_colors":"Cores e degradês","colors_text":"Em {fill}, escolha {color}. Defina a cor principal, ative o degradê para adicionar uma segunda cor e ajuste o ângulo. Clique numa cor da paleta para a cor principal — clique com o botão direito para a segunda.","settings_text":"Abra {settings} pelo botão de engrenagem no topo. As escolhas ficam salvas para o seu usuário.","st_lang":"escolha qualquer um dos 15 idiomas — toda a interface muda na hora.","st_anim":"estrelas piscando, brilhos pulsando e transições suaves; desligue quando quiser.","st_reduce":"interface lisa e estática para PCs lentos ou área de trabalho remota.","st_intensity":"a força do tema neon.","st_export":"pasta padrão de exportação, tamanho padrão do PNG e quais tamanhos vão dentro do .ico.","about_text":"{help} explica cada recurso e lista os atalhos de teclado. {about} mostra a versão, a licença e os links do site, do projeto e de doação.","tbl_title":"O que viaja junto com a pasta","tbl_situation":"Situação","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Arquivos / Nemo / Caja / Thunar","r1":"Ícone aplicado pelo Dosye direto no pendrive (do Windows ou do Linux), aberto em outro PC","r2":"Pasta copiada Windows → pendrive → Windows pelo Explorador","r3":"Pasta copiada com xcopy /E /H /K (mantém atributos)","r4":"Pasta copiada de um disco Linux (ext4/btrfs) para o Windows","r5":"Windows → Linux","r6":"zip, OneDrive / Google Drive / Dropbox","c_auto":"automático","c_repair":"Reparar","c_once":"Reparar uma vez por PC","c_maybe":"automático se o atributo sobreviveu; senão Reparar","c_hidden":"automático se os ocultos forem mantidos","legend":"✅ funciona sozinho · 🔧 um clique em {repair}","links_title":"Links","l_site":"Site oficial","l_repo":"Código-fonte no GitHub","l_releases":"Releases e novidades","l_donate":"Apoie o projeto","footer":"Dosye é software livre sob a licença GPL-3.0. Feito com ♥ por cleitinhodev.","top":"Voltar ao topo","shot_hint":"Clique para ampliar","meaning":"“Dosye” significa “pasta” em crioulo haitiano."},"win":["Mais informações","Executar assim mesmo"]},"es":{"ui":{"app.tagline":"Iconos de carpeta personalizados y bonitos — luz, sombra, imágenes y exportación .ico","shapes.title":"Formas","shapes.search":"Buscar formas…","hdr.surprise":"Sorpréndeme","hdr.open":"Abrir","hdr.save":"Guardar","hdr.reset":"Restablecer","hdr.settings":"Ajustes","hdr.help":"Ayuda","hdr.about":"Acerca de Dosye","hdr.donate":"Donar","cat.all":"Todas","cat.classic":"Clásicas","cat.modern":"Modernas","cat.retro":"Retro","cat.office":"Oficina","cat.fun":"Divertidas","cat.special":"Especiales","preview.title":"Vista previa","fill.title":"Relleno","fill.color":"Color / degradado","fill.image":"Imagen (portada)","cover.choose":"Elegir imagen…","cover.examples":"Portadas de ejemplo:","cover.apply_to":"Aplicar a","cover.area_all":"Toda la carpeta","cover.area_front":"Solo el frente","fit.cobrir":"Cubrir","fit.ajustar":"Ajustar","fit.lado":"Mosaico","cover.zoom":"Zoom","cover.tint":"Teñir con el color","cover.blend":"Mezcla de color","cover.back_dark":"Oscurecer el fondo","color.main":"Color principal","color.gradient":"Usar degradado","color.second":"Segundo color","color.angle":"Ángulo del degradado","color.palette":"Paleta rápida (clic derecho = 2.º color)","light.title":"Luz y brillo","light.intensity":"Intensidad de la luz","light.dir":"Dirección de la luz","light.gloss":"Acabado brillante","light.glow":"Resplandor exterior","shadow.title":"Sombra","shadow.drop":"Sombra proyectada","shadow.inner":"Sombreado interior","details.title":"Detalles","details.papers":"Papeles dentro de la carpeta","details.mirror":"Pestaña a la derecha (espejo)","details.glass":"Frente de vidrio esmerilado","details.border":"Contorno","png.title":"Imagen PNG","png.none":"Sin imagen","png.inside":"Saliendo","png.front":"Emblema","png.load":"Cargar PNG…","png.scale":"Tamaño","png.rot":"Rotación","png.shadow":"Sombra de la imagen","png.emblem_style":"Estilo del emblema","emblem.original":"Colores originales","emblem.gravado":"En relieve","emblem.branco":"Silueta blanca","export.ico":"Exportar icono (.ico)","export.png":"Exportar PNG","export.apply":"Aplicar icono a una carpeta…","export.remove":"Quitar icono de una carpeta…","export.repair":"Reparar iconos de carpetas…","settings.title":"Ajustes","settings.language":"Idioma","settings.animations":"Animaciones neón","settings.reduce":"Reducir efectos (sin brillo ni animación)","settings.intensity":"Intensidad del tema","settings.export":"Exportación","settings.export_dir":"Carpeta de exportación predeterminada","settings.png_size":"Tamaño PNG predeterminado","settings.ico_sizes":"Tamaños dentro del .ico","settings.restore":"Restaurar valores","about.desc":"Iconos de carpeta personalizados con colores, degradados, portadas, luz, sombra e imágenes PNG — exportados como .ico o .png, para Windows y Linux.","about.meaning":"“Dosye” significa “carpeta” en criollo haitiano. 🇭🇹","about.site":"Sitio oficial","about.project":"Proyecto en GitHub","about.donate":"Donar","about.license":"Licencia: GPL-3.0","help.title":"Ayuda","help.shortcuts.title":"Atajos de teclado","repair.title":"Reparar iconos de carpetas","act.export_ico":"Exportar icono (.ico)","act.export_png":"Exportar PNG","act.open_preset":"Abrir preset","act.save_preset":"Guardar preset","act.surprise":"Sorpréndeme (diseño aleatorio)","act.search":"Buscar formas","act.settings":"Ajustes","act.help":"Ayuda","act.quit":"Salir","_language":"Español"},"help":{"start.title":"Primeros pasos","start.body":"1. Elige una <b>forma</b> a la izquierda. 2. Ajusta el <b>Fill</b> <span class=\"nat\">(relleno)</span> y los efectos a la derecha. 3. Haz clic en <b>Export icon (.ico)</b> <span class=\"nat\">(Exportar icono (.ico))</span> o <b>Apply icon to a folder</b> <span class=\"nat\">(Aplicar icono a una carpeta)</span>. ¿Sin ideas? Pulsa <b>Surprise me</b> <span class=\"nat\">(Sorpréndeme)</span>.","shapes.title":"Formas","shapes.body":"Hay 51 formas en seis categorías. Usa los botones de categoría o escribe en el buscador (los acentos son opcionales). Las miniaturas siempre usan tus colores actuales.","fill.title":"Color, degradado y portada","fill.body":"<b>Colour / gradient</b> <span class=\"nat\">(Color / degradado)</span> pinta la carpeta con uno o dos colores (clic derecho en un color de la paleta para el segundo). <b>Image (cover)</b> <span class=\"nat\">(Imagen (portada))</span> usa cualquier foto o textura: aplícala a toda la carpeta o solo al frente, elige Cubrir, Ajustar o Mosaico y luego haz zoom, muévela (arrastrando en la vista previa), tíñela y mézclala con el color.","png.title":"Imagen PNG: saliendo o emblema","png.body":"Carga un PNG (o suéltalo en la vista previa). <b>Coming out</b> <span class=\"nat\">(Saliendo)</span> lo coloca entre el fondo y el frente, como si asomara de la carpeta. <b>Emblem</b> <span class=\"nat\">(Emblema)</span> lo imprime en el frente con colores originales, en relieve o como silueta blanca. Arrástralo en la vista previa y usa la rueda para cambiar el tamaño; mantén <b>Shift</b> para alternar entre el PNG y la portada.","effects.title":"Luz, sombra y detalles","effects.body":"Ajusta la intensidad y dirección de la luz, el brillo, el resplandor exterior, la sombra proyectada, el sombreado interior, los papeles dentro, el frente de vidrio esmerilado, el contorno y la pestaña reflejada (a la derecha). Todo funciona con todas las formas.","export.title":"Exportar","export.body":"<b>Export icon (.ico)</b> <span class=\"nat\">(Exportar icono (.ico))</span> escribe un solo archivo con varios tamaños (de 16 a 256 px — elígelos en Ajustes). <b>Export PNG</b> <span class=\"nat\">(Exportar PNG)</span> guarda imágenes de 256, 512 o 1024 px con transparencia.","folder.title":"Aplicar el icono a una carpeta","folder.body":"Dosye escribe el icono <b>dentro de la carpeta</b> en todos los formatos a la vez: un .ico oculto con un desktop.ini (Windows), un PNG oculto con un archivo .directory (KDE Dolphin, PCManFM-Qt) y, en Linux, el ajuste GIO que usan GNOME Archivos, Nemo, Caja y Thunar. Así la misma carpeta muestra su icono en Windows y en Linux, incluso en una memoria USB. Pulsa F5 si el Explorador no se actualiza. <b>Remove icon from a folder</b> <span class=\"nat\">(Quitar icono de una carpeta)</span> lo borra todo.","repair.title":"¿El icono desapareció al copiar? Repáralo","repair.body":"Windows solo muestra el icono de una carpeta mientras esta tiene una marca especial, y copiar con el Explorador, comprimir en zip, sincronizar con la nube o copiar desde Linux puede perderla. GNOME Archivos, Nemo, Caja y Thunar guardan el ajuste del icono en cada equipo, así que tampoco viaja. Los archivos del icono sí viajan con la carpeta: pulsa <b>Repair folder icons</b> <span class=\"nat\">(Reparar iconos de carpetas…)</span>, elige una carpeta o una unidad entera y Dosye restaura todos los iconos que creó allí y en todas las subcarpetas. KDE Dolphin y PCManFM-Qt no necesitan reparación. Consejo: en Windows, <code>xcopy /E /H /K</code> conserva la marca.","presets.title":"Presets","presets.body":"<b>Save</b> <span class=\"nat\">(Guardar)</span> almacena tu diseño en un archivo .dosye.json con las imágenes incluidas, así funciona en cualquier ordenador. <b>Open</b> <span class=\"nat\">(Abrir)</span> también lee presets del Gerador de Pastas (.pasta.json). También puedes soltar un preset en la vista previa."},"page":{"nav_download":"Descargar","nav_tutorial":"Tutorial","nav_links":"Enlaces","lang_label":"Idioma","kicker":"Gratis y de código abierto · Windows y Linux","cta_windows":"Descargar para Windows","cta_linux":"Descargar para Linux","cta_github":"Ver en GitHub","version":"Versión","dl_title":"Descargar","dl_sub":"Portable — no hay que instalar nada. Elige tu sistema:","dl_exe":"Windows 10/11 · 64 bits · un archivo portable: doble clic para abrirlo.","dl_appimage":"Linux x86_64 · hazlo ejecutable y ábrelo.","dl_targz":"Linux x86_64 · extrae y ejecuta ./dosye — o ./install.sh para añadirlo al menú (sin root).","dl_all":"Todas las versiones","smart_title":"SmartScreen de Windows","smart_body":"El ejecutable aún no está firmado, así que Windows puede mostrar «Windows protegió su PC». Haz clic en {more} y luego en {run}.","linux_cmd":"En Linux:","tut_title":"Tutorial","tut_sub":"Todo lo que hace Dosye, paso a paso.","where":"Dónde","controls":"Controles","s_first":"Descarga y primer uso","first_text":"Abre Dosye: a la izquierda están las formas, en el centro la vista previa en vivo (con los tamaños reales del icono debajo) y a la derecha el panel de diseño. Cada cambio se ve al instante.","s_colors":"Colores y degradados","colors_text":"En {fill}, elige {color}. Escoge el color principal, activa el degradado para añadir un segundo color y ajusta su ángulo. Haz clic en un color de la paleta para el principal — clic derecho para el segundo.","settings_text":"Abre {settings} con el botón del engranaje de la cabecera. Tus opciones se guardan por usuario.","st_lang":"elige cualquiera de los 15 idiomas — toda la interfaz cambia al instante.","st_anim":"estrellas que titilan, brillos que respiran y transiciones suaves; desactívalas cuando quieras.","st_reduce":"interfaz plana y estática para PC lentos o escritorio remoto.","st_intensity":"la intensidad del tema neón.","st_export":"carpeta de exportación por defecto, tamaño PNG por defecto y qué tamaños van dentro del .ico.","about_text":"{help} explica cada función y muestra los atajos de teclado. {about} muestra la versión, la licencia y los enlaces al sitio, al proyecto y a las donaciones.","tbl_title":"Qué viaja con la carpeta","tbl_situation":"Situación","tbl_win":"Windows","tbl_kde":"KDE Dolphin / PCManFM-Qt","tbl_gnome":"GNOME Archivos / Nemo / Caja / Thunar","r1":"Icono aplicado por Dosye directamente en la memoria USB (desde Windows o Linux), abierta en otro PC","r2":"Carpeta copiada Windows → USB → Windows con el Explorador","r3":"Carpeta copiada con xcopy /E /H /K (conserva atributos)","r4":"Carpeta copiada de un disco Linux (ext4/btrfs) a Windows","r5":"Windows → Linux","r6":"zip, OneDrive / Google Drive / Dropbox","c_auto":"automático","c_repair":"Reparar","c_once":"Reparar una vez por PC","c_maybe":"automático si el atributo sobrevivió; si no, Reparar","c_hidden":"automático si se conservan los ocultos","legend":"✅ funciona solo · 🔧 un clic en {repair}","links_title":"Enlaces","l_site":"Sitio oficial","l_repo":"Código fuente en GitHub","l_releases":"Versiones y novedades","l_donate":"Apoya el proyecto","footer":"Dosye es software libre bajo la licencia GPL-3.0. Hecho con ♥ por cleitinhodev.","top":"Volver arriba","shot_hint":"Clic para ampliar","meaning":"«Dosye» significa «carpeta» en criollo haitiano."},"win":["Más información","Ejecutar de todas formas"]},"de":{"ui":{"app.tagline":"Schöne eigene Ordner-Icons — Licht, Schatten, Bilder und .ico-Export","shapes.title":"Formen","shapes.
